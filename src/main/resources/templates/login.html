<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">

<head th:replace="~{fragments/layout :: html_head('Login - Braindribbler')}"></head>

<body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main class="page-card auth-layout">
        <h1 class="page-title" style="text-align: center;">Sign In</h1>
        <p class="page-subtitle" style="text-align: center; margin-bottom: 20px;">Access your chef portal</p>

        <div th:if="${param.error}" class="alert alert--danger">Invalid email address or password.</div>
        <div th:if="${param.logout}" class="alert alert--success">You have been successfully logged out.</div>
        <div th:if="${param.success}" class="alert alert--info">Account created successfully! Please sign in.</div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="form-group">
                <label for="username" class="form-label">Email Address</label>
                <input type="email" id="username" name="username" class="form-input" required
                    placeholder="recipe@braindribbler.com" />
            </div>
            <div class="form-group form-group--last">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-input" required
                    placeholder="••••••••" />
            </div>
            <button type="submit" class="btn btn--primary">Log In</button>
        </form>
        <p class="auth-footer-text">Don't have an account? <a th:href="@{/register}" class="auth-link">Register here</a>
        </p>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>

</html>
