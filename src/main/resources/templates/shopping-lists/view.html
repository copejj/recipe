<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz"
      layout:decorate="~{fragments/layout}"
      lang="en">

<head>
    <title th:text="${shoppingList.listName}">Shopping List</title>
    <th:block layout:fragment="page_styles">
        <link rel="stylesheet" th:href="@{/css/recipes/view.css}" />
        <link rel="stylesheet" th:href="@{/css/meal-plans/meal-plan.css}" />
    </th:block>
</head>

<body>
    <h1 layout:fragment="page-title" th:text="${shoppingList.listName}">Shopping List</h1>
    <p layout:fragment="page-subtitle">Grouped by grocery aisle • Check items off as you shop</p>

    <div layout:fragment="action-tray" class="action-tray">
        <div class="action-box">
            <span id="syncStatusBadge" class="sync-status-pill">Synced</span>

            <a th:href="@{/}" class="btn btn-secondary">← Home</a>
            <button type="button"
                    th:if="${canEdit}"
                    data-open-modal="addExtraItemModal"
                    class="btn btn-action btn-action--primary">
                + Add Item
            </button>

            <button type="button"
                    id="toggleShowAllBtn"
                    class="btn btn-action btn-action--view btn-action--toggle"
                    aria-pressed="false">
                Show All
            </button>

            <form th:if="${canEdit}"
                th:action="@{/shopping-lists/{id}/reset(id=${shoppingList.publicId})}"
                method="post"
                class="inline-form-reset">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit"
                        class="btn btn-action btn-action--reset"
                        data-confirm="Reset this shopping list? This will uncheck all items, remove extra additions, and reload ingredients from the meal plan.">
                    Reset
                </button>
            </form>
        </div>
    </div>

    <main layout:fragment="content" id="shoppingListApp" th:data-list-public-id="${shoppingList.publicId}">
        <div th:if="${successMessage}" class="alert alert--success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert--danger" th:text="${errorMessage}"></div>

        <!-- AISLE-GROUPED CHECKLIST -->
        <div th:if="${itemsByAisle == null || itemsByAisle.isEmpty()}" class="alert alert--info">
            Your shopping list is empty. Add items above or generate items from a meal plan!
        </div>
        <div id="allItemsDoneMessage"
             th:if="${itemsByAisle != null && !itemsByAisle.isEmpty()}"
             class="alert alert--success hide-cell">
            <strong>All Done, now what?!</strong> Everything on your list is checked off. Tap <strong>Show All</strong> above to review or uncheck items.
        </div>

        <div th:each="entry : ${itemsByAisle}" class="shopping-category-section">
            <h4 class="recipe-panel-heading" th:text="${entry.key}">Produce</h4>

            <ul class="recipe-ingredient-list standard-list-reset">
                <li th:each="item : ${entry.value}" class="recipe-ingredient-row shopping-item-modifier shopping-row-flex">
                    <label class="shopping-item-content">
                        <input type="checkbox"
                               class="shopping-item-checkbox"
                               th:checked="${item.isChecked}"
                               th:data-item-id="${item.shoppingListItemId}" />

                        <span class="shopping-item-text" th:classappend="${item.isChecked} ? 'crossed-out-text' : ''">
                            <span th:text="${item.displayName}" class="ingredient-name">Chicken Broth</span>

                            <span th:if="${item.amount != null && item.amount.compareTo(T(java.math.BigDecimal).ZERO) > 0}">
                                -
                                <span class="scalable-amount"
                                    th:data-base-amount="${item.amount}"
                                    th:data-base-type-id="${item.measurement != null && item.measurement.baseType != null ? item.measurement.baseType.baseTypeId : ''}"
                                    th:data-base-unit-equivalent="${item.measurement != null ? item.measurement.baseUnitEquivalent : ''}"
                                    th:data-original-unit-id="${item.measurement != null ? item.measurement.measurementId : ''}"
                                    th:data-is-promotable="${item.measurement != null ? item.measurement.isPromotable : false}"
                                    th:data-ingredient-classification="${item.ingredient != null && item.ingredient.classification != null ? item.ingredient.classification.name() : ''}"
                                    th:text="${T(com.braindribbler.recipe.util.RecipeUtility).convertDecimalToKitchenFraction(item.amount)}">2</span>

                                <span th:if="${item.measurement != null}"
                                    class="scalable-unit-name"
                                    th:data-original-unit-name="${item.measurement.unitName}"
                                    th:text="${item.measurement.unitName}">Cups</span>

                                <span class="oz-package-preview"></span>
                            </span>

                            <span class="ingredient-note"
                                th:if="${item.note != null && !item.note.isBlank()}"
                                th:text="' - [' + ${item.note} + ']'"></span>

                            <span th:if="${item.isManualAddition}" class="badge-extra-item">Extra</span>
                        </span>
                    </label>

                    <form th:if="${canEdit}"
                        th:action="@{/shopping-lists/{lid}/items/{iid}/delete(lid=${shoppingList.publicId}, iid=${item.shoppingListItemId})}"
                        method="post" class="inline-form-reset">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-action btn-action--delete" title="Remove item">✕</button>
                    </form>
                </li>
            </ul>
        </div>

        <th:block th:if="${canEdit}">
            <div th:replace="~{fragments/modals :: genericModal(
                'addExtraItemModal',
                'Add Extra Item to Pick Up',
                ~{::addExtraItemForm}
            )}">
                <th:block th:fragment="addExtraItemForm">
                    <form th:action="@{/shopping-lists/{id}/items/add(id=${shoppingList.publicId})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="form-group">
                            <label for="customItemName" class="form-label">Item Name</label>
                            <input type="text" id="customItemName" name="customItemName" class="form-input" required
                                placeholder="e.g., Paper Towels, Bananas..." />
                        </div>

                        <div class="inline-flex-form">
                            <div class="form-group flex-field-sm">
                                <label for="extraAmount" class="form-label">Qty</label>
                                <input type="number" id="extraAmount" step="0.25" min="0" name="amount" class="form-input" placeholder="1" />
                            </div>

                            <div class="form-group flex-field-med">
                                <label for="extraMeasurementId" class="form-label">Unit (Optional)</label>
                                <select id="extraMeasurementId" name="measurementId" class="form-input">
                                    <option value="">(None)</option>
                                    <option th:each="m : ${measurements}"
                                            th:value="${m.measurementId}"
                                            th:text="${m.unitName}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="extraCategoryId" class="form-label">Store Aisle</label>
                            <select id="extraCategoryId" name="groceryCategoryId" class="form-input">
                                <option th:each="cat : ${groceryCategories}"
                                        th:value="${cat.groceryCategoryId}"
                                        th:selected="${cat.categoryName.toLowerCase().contains('other')}"
                                        th:text="${cat.categoryName}">Category</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="extraNote" class="form-label">Note (Optional)</label>
                            <input type="text" id="extraNote" name="note" class="form-input" placeholder="Brand, size..." />
                        </div>

                        <div class="modal-actions-footer">
                            <button type="submit" class="btn btn--primary btn--submit">Add to List</button>
                            <button type="button" data-close-modal class="btn btn--cancel">Cancel</button>
                        </div>
                    </form>
                </th:block>
            </div>
        </th:block>
    </main>

    <th:block layout:fragment="page_scripts">
        <script th:src="@{/js/meal-plans/shopping-list.js}"></script>
    </th:block>
</body>
</html>
