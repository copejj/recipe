<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz"
      layout:decorate="~{fragments/layout}"
      lang="en">

<head>
    <title th:text="${shoppingList.listName}">Shopping List</title>
    <th:block layout:fragment="page_styles">
        <link rel="stylesheet" th:href="@{/css/recipes/view.css}" />
        <link rel="stylesheet" th:href="@{/css/meal-plans/meal-plan.css}" />
    </th:block>
</head>

<body>
    <h1 layout:fragment="page-title" th:text="${shoppingList.listName}">Shopping List</h1>
    <p layout:fragment="page-subtitle">Grouped by grocery aisle • Check items off as you shop</p>

    <div layout:fragment="action-tray" class="action-tray">
        <a th:if="${shoppingList.mealPlan != null}"
           th:href="@{/meal-plans/{id}(id=${shoppingList.mealPlan.publicId})}"
           class="btn btn-secondary">
            ← Back to Meal Plan
        </a>
        <a th:unless="${shoppingList.mealPlan != null}"
           th:href="@{/meal-plans}"
           class="btn btn-secondary">
            ← Meal Plans
        </a>
        <span id="syncStatusBadge" class="sync-status-pill">Synced</span>
    </div>

    <main layout:fragment="content" id="shoppingListApp" th:data-list-public-id="${shoppingList.publicId}">
        <div th:if="${successMessage}" class="alert alert--success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert--danger" th:text="${errorMessage}"></div>

        <!-- ADD EXTRA STORE ITEM FORM -->
        <div class="meal-plan-card-wide">
            <h3 class="profile-section-title">Add Extra Item to Pick Up</h3>
            <form th:action="@{/shopping-lists/{id}/items/add(id=${shoppingList.publicId})}" method="post" class="inline-flex-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group flex-field-grow">
                    <label class="form-label">Item Name (e.g., Paper Towels, Bananas)</label>
                    <input type="text" name="customItemName" class="form-input" required
                           placeholder="Type any store item..." />
                </div>

                <div class="form-group flex-field-sm">
                    <label class="form-label">Qty</label>
                    <input type="number" step="0.25" min="0" name="amount" class="form-input" placeholder="1" />
                </div>

                <div class="form-group flex-field-med">
                    <label class="form-label">Unit (Optional)</label>
                    <select name="measurementId" class="form-input">
                        <option value="">(None)</option>
                        <option th:each="m : ${measurements}"
                                th:value="${m.measurementId}"
                                th:text="${m.unitName}"></option>
                    </select>
                </div>

                <div class="form-group flex-field-med">
                    <label class="form-label">Store Aisle</label>
                    <select name="groceryCategoryId" class="form-input">
                        <option th:each="cat : ${groceryCategories}"
                                th:value="${cat.groceryCategoryId}"
                                th:selected="${cat.categoryName.toLowerCase().contains('other')}"
                                th:text="${cat.categoryName}">Category</option>
                    </select>
                </div>

                <div class="form-group flex-field-med">
                    <label class="form-label">Note (Optional)</label>
                    <input type="text" name="note" class="form-input" placeholder="Brand, size..." />
                </div>

                <button type="submit" class="btn btn--primary">+ Add Item</button>
            </form>
        </div>
        <!-- AISLE-GROUPED CHECKLIST -->
        <div th:if="${itemsByAisle == null || itemsByAisle.isEmpty()}" class="alert alert--info">
            Your shopping list is empty. Add items above or generate items from a meal plan!
        </div>

        <div th:each="entry : ${itemsByAisle}" class="shopping-category-section">
            <h4 class="recipe-panel-heading" th:text="${entry.key}">Produce</h4>

            <ul class="recipe-ingredient-list standard-list-reset">
                <li th:each="item : ${entry.value}" class="recipe-ingredient-row shopping-item-modifier shopping-row-flex">
                    <label class="shopping-item-content">
                        <input type="checkbox"
                               class="shopping-item-checkbox"
                               th:checked="${item.isChecked}"
                               th:data-item-id="${item.shoppingListItemId}" />

                        <span class="shopping-item-text"
                              th:classappend="${item.isChecked} ? 'crossed-out-text' : ''">
                            <strong th:text="${item.displayName}">Chicken Broth</strong>

                            <span th:if="${item.amount != null && item.amount.compareTo(T(java.math.BigDecimal).ZERO) > 0}">
                                —
                                <span th:text="${T(com.braindribbler.recipe.util.RecipeUtility).convertDecimalToKitchenFraction(item.amount)}">2</span>
                                <span th:if="${item.measurement != null}" th:text="${item.measurement.unitName}">Cups</span>
                            </span>

                            <span class="ingredient-note"
                                  th:if="${item.note != null && !item.note.isBlank()}"
                                  th:text="' - [' + ${item.note} + ']'"></span>

                            <span th:if="${item.isManualAddition}" class="badge-extra-item">Extra</span>
                        </span>
                    </label>

                    <form th:action="@{/shopping-lists/{lid}/items/{iid}/delete(lid=${shoppingList.publicId}, iid=${item.shoppingListItemId})}"
                          method="post" class="inline-form-reset">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-action btn-action--delete" title="Remove item">✕</button>
                    </form>
                </li>
            </ul>
        </div>
    </main>

    <th:block layout:fragment="page_scripts">
        <script th:src="@{/js/meal-plans/shopping-list.js}"></script>
    </th:block>
</body>
</html>
