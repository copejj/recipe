<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">

<head th:replace="~{fragments/layout :: html_head(${recipe.title})}"></head>

<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page-card">
        <!-- 1. JUMBO IDENTITY HEADER WITH LIVE SCALING CONTROLLERS -->
        <div
            style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; margin-bottom: 24px;">
            <div>
                <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
                    <h1 th:text="${recipe.title}" style="margin: 0; font-size: 2.25rem; color: var(--color-text-dark);">
                        Tasty Recipe Title</h1>

                    <!-- ✏️ EDIT BUTTON SHORTCUT LINK -->
                    <th:block
                        th:if="${currentUser != null and String.valueOf(recipe.user.userId).equals(String.valueOf(currentUser.userId))}">
                        <a th:href="@{/recipes/edit/{id}(id=${recipe.recipeId})}" class="btn"
                            style="width: auto; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; background-color: #ffc107; color: #212529; border: 1px solid #e0a800; border-radius: 6px; text-decoration: none; transition: all 0.2s ease;">
                            ✏️ Edit Recipe
                        </a>
                    </th:block>
                </div>
                <div style="font-size: 0.9rem; color: var(--color-text-muted); margin-top: 4px;">
                    Created by <span th:text="${recipe.user.displayName}" style="font-weight: 600;">Author</span>
                </div>
            </div>

            <!-- 🎛️ SYSTEM MODE AND SERVINGS MULTIPLIER BUTTON GROUP PANELS -->
            <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">

                <!-- US Imperial ⇄ Metric Switcher Component Widget -->
                <div
                    style="background-color: var(--color-bg-card); padding: 12px 16px; border-radius: 8px; border: 1px solid var(--color-border); display: flex; align-items: center; gap: 10px;">
                    <span style="font-weight: 700; font-size: 0.9rem; color: var(--color-text-dark);">📐 System:</span>
                    <div class="system-toggle-wrapper"
                        style="display: flex; border: 1px solid var(--color-border-input, #ccc); border-radius: 6px; overflow: hidden; background-color: #f8f9fa;">
                        <button type="button" id="system-imperial-btn" class="system-toggle-btn active"
                            data-system="imperial"
                            style="border: none; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; background-color: var(--color-primary); color: white; transition: all 0.2s;">Imperial</button>
                        <button type="button" id="system-metric-btn" class="system-toggle-btn" data-system="metric"
                            style="border: none; padding: 6px 14px; font-size: 0.85rem; font-weight: 600; cursor: pointer; background-color: transparent; color: var(--color-text-muted); transition: all 0.2s;">Metric</button>
                    </div>
                </div>

                <!-- Live Servings Input Scaler -->
                <div
                    style="background-color: var(--color-bg-card); padding: 12px 16px; border-radius: 8px; border: 1px solid var(--color-border); display: flex; align-items: center; gap: 10px;">
                    <label for="servings-scaler"
                        style="font-weight: 700; font-size: 0.9rem; color: var(--color-text-dark); margin: 0;">🍳
                        Servings:</label>
                    <input type="number" id="servings-scaler" th:value="${recipe.servings}"
                        th:data-original-servings="${recipe.servings}" min="1" step="1"
                        style="width: 70px; padding: 6px; border-radius: 4px; border: 1px solid var(--color-border-input); font-weight: bold; text-align: center;" />
                </div>
            </div>
        </div>

        <!-- 🎛️ VIEW PANEL TABS SWITCH NAVIGATION HEADER BAR -->
        <div class="view-mode-tabs"
            style="display: flex; gap: 8px; margin-bottom: 30px; border-bottom: 2px solid var(--color-border); padding-bottom: 10px;">
            <button type="button" class="tab-btn active" data-target="prep-panel"
                style="padding: 10px 20px; font-weight: 700; border: none; background: none; cursor: pointer; color: var(--color-primary); border-bottom: 3px solid var(--color-primary); margin-bottom: -13px; font-size: 1rem;">🍳
                Kitchen Prep Mode</button>
            <button type="button" class="tab-btn" data-target="overview-panel"
                style="padding: 10px 20px; font-weight: 600; border: none; background: none; cursor: pointer; color: var(--color-text-muted); font-size: 1rem;">📖
                Recipe Overview</button>
            <button type="button" class="tab-btn" data-target="shopping-panel"
                style="padding: 10px 20px; font-weight: 600; border: none; background: none; cursor: pointer; color: var(--color-text-muted); font-size: 1rem;">🛒
                Grocery Shopping List</button>
        </div>

        <!-- 🎛️ MODULAR DISPLAY LAYOUT CHANNELS -->
        <div id="prep-panel" class="tab-panel active-panel">
            <div th:insert="~{recipes/views/prep :: prep-panel}"></div>
        </div>

        <div id="overview-panel" class="tab-panel" style="display: none;">
            <div th:insert="~{recipes/views/overview :: overview-panel}"></div>
        </div>

        <div id="shopping-panel" class="tab-panel" style="display: none;">
            <div th:insert="~{recipes/views/shopping :: shopping-view}"></div>
        </div>

    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <!-- 🌐 DATA BOOTSTRAP HOOK LAYER: Runs only on profile view sheets -->
    <script th:inline="javascript">
        window.MEASUREMENT_MATRIX = /*[[${globalMeasurementsPool}]]*/[];
    </script>
    <script th:src="@{/js/recipe-view.js}"></script>
</body>

</html>
