<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">

<head th:replace="~{fragments/layout :: html_head(${recipe.title})}"></head>

<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page-card">
        <!-- Main Recipe Summary Jumbotron Block -->
        <h1 th:text="${recipe.title}" style="margin-bottom: 6px; font-size: 2.25rem; color: var(--color-text-dark);">
            Tasty Recipe Title</h1>
        <div style="font-size: 0.9rem; color: var(--color-text-muted); margin-bottom: 24px;">
            Created by <span th:text="${recipe.user.displayName}" style="font-weight: 600;">Author</span>
        </div>

        <!-- 🎛️ NAVIGATION BAR: VIEW MODE CONTROLLER SWITCHES -->
        <div class="view-mode-tabs"
            style="display: flex; gap: 8px; margin-bottom: 30px; border-bottom: 2px solid var(--color-border); padding-bottom: 10px;">
            <button type="button" class="tab-btn active" data-target="overview-panel"
                style="padding: 10px 20px; font-weight: 700; border: none; background: none; cursor: pointer; color: var(--color-primary); border-bottom: 3px solid var(--color-primary); margin-bottom: -13px; font-size: 1rem;">📖
                Recipe Overview</button>
            <button type="button" class="tab-btn" data-target="prep-panel"
                style="padding: 10px 20px; font-weight: 600; border: none; background: none; cursor: pointer; color: var(--color-text-muted); font-size: 1rem;">🍳
                Kitchen Prep Mode</button>
            <button type="button" class="tab-btn" data-target="shopping-panel"
                style="padding: 10px 20px; font-weight: 600; border: none; background: none; cursor: pointer; color: var(--color-text-muted); font-size: 1rem;">🛒
                Grocery Shopping List</button>
        </div>

        <!-- 🎛️ MODULAR PANEL CHANNELS: TARGET FRAGMENT REPLACEMENTS -->
        <div th:replace="~{recipes/views/overview :: overview-panel}"></div>
        <div th:replace="~{recipes/views/prep :: prep-panel}"></div>
        <div th:replace="~{recipes/views/shopping :: shopping-panel}"></div>

    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <!-- Client-side tab navigation toggle logic -->
    <script th:src="@{/js/recipe-view.js}"></script>
</body>

</html>
