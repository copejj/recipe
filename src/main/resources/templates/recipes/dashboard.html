<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">

<head th:replace="~{fragments/layout :: html_head('Dashboard - Braindribbler')}"></head>

<body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main>
        <div class="page-card">
            <h1 class="page-title" style="color: #28a745;">Session Fully Authenticated</h1>
            <p th:text="${message}" class="page-subtitle">Placeholder welcome text.</p>

            <hr class="dashboard-divider" />

            <p>Your security infrastructure is fully operational:</p>
            <div class="status-grid">
                <div class="status-item">
                    <div class="status-info">
                        <span class="status-label">Password Engine</span>
                        <span class="status-value">Argon2id</span>
                    </div>
                </div>
                <div class="status-item">
                    <div class="status-info">
                        <span class="status-label">Identity Storage</span>
                        <span class="status-value">PostgreSQL</span>
                    </div>
                </div>
                <div class="status-item">
                    <div class="status-info">
                        <span class="status-label">Layout Engine</span>
                        <span class="status-value">Thymeleaf</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>

</html>
