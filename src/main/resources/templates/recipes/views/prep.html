<!-- templates/recipes/views/prep.html -->
<div th:fragment="prep-panel" class="recipe-view-panel">

    <!-- Iterates chronologically showing step descriptions with step-scoped sub-ingredients -->
    <div th:each="step, stepStat : ${recipe.steps}" class="step-card">
        <h3 th:text="'Step ' + ${stepStat.count}">Step 1</h3>
        <p th:text="${step.instructionText}" class="step-instruction">Mix, bake, and enjoy!</p>

        <!-- CONDITIONALLY HIDDEN Sub-box -->
        <div th:if="${step.stepIngredients != null && !step.stepIngredients.isEmpty()}" class="recipe-ingredient-card-panel step-modifier">
            <h5 class="step-ingredients-subheading">Ingredients for this step:</h5>
            <ul class="recipe-ingredient-list">
                <li th:each="item : ${step.stepIngredients}" class="recipe-ingredient-row">
                    <span class="scalable-amount" 
                          th:data-base-amount="${item.amount}"
                          th:data-base-type-id="${item.measurement.baseType.baseTypeId}"
                          th:data-base-unit-equivalent="${item.measurement.baseUnitEquivalent}"
                          th:data-original-unit-id="${item.measurement.measurementId}"
                          th:data-is-promotable="${item.measurement.isPromotable}"
                          th:data-ingredient-classification="${item.ingredient.classification.name()}"
                          th:text="${T(com.braindribbler.recipe.util.RecipeUtility).convertDecimalToKitchenFraction(item.amount)}">1</span>

                    <span class="scalable-unit-name" 
                          th:data-original-unit-name="${item.measurement.unitName}" 
                          th:text="${item.measurement.unitName}">Cups</span>
                    <strong class="ingredient-name" th:text="${item.ingredient.ingredientName}">Flour</strong>
                    <span class="oz-package-preview"></span>

                    <span class="ingredient-note" 
                        th:if="${item.ingredientNote != null && !#strings.isEmpty(item.ingredientNote)}" 
                        th:text="' - [' + ${item.ingredientNote} + ']'">Some Note</span>
                </li>
            </ul>
        </div>
    </div>

    <!-- GENERAL RECIPE CHEF NOTES FOOTER CARD -->
    <div th:if="${recipe.recipeNote != null && !recipe.recipeNote.trim().isEmpty()}" class="chef-notes-footer-card">
        <h4 class="chef-notes-heading">📝 Chef Notes &amp; Parameters</h4>
        <p class="chef-notes-footer-text" th:text="${recipe.recipeNote}"></p>
    </div>

</div>
