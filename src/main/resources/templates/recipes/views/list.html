<!-- templates/recipes/views/list.html -->
<div th:fragment="list-view" class="recipe-view-panel">
    <!-- Category Loop -->
    <div th:each="entry : ${shoppingListAggregatedIngredients}" class="shopping-category-section">
        <h4 class="recipe-panel-heading" th:text="${entry.key}">Produce</h4>

        <ul class="recipe-ingredient-list standard-list-reset">
            <li th:each="item : ${entry.value}" class="recipe-ingredient-row shopping-item-modifier">
                <div class="shopping-item-content">
                    <input type="checkbox" 
                        checked="checked" 
                        class="shopping-item-checkbox" 
                        th:data-item-key="${item.ingredient.ingredientId != null ? item.ingredient.ingredientId : item.ingredient.ingredientName}" />


                    <span class="shopping-item-text">
                        <span th:text="${item.ingredient.ingredientName}" class="ingredient-name">Chicken Broth</span>
                        -

                        <strong class="scalable-amount" 
                                th:data-base-amount="${item.amount}"
                                th:data-base-type-id="${item.measurement.baseType.baseTypeId}"
                                th:data-base-unit-equivalent="${item.measurement.baseUnitEquivalent}"
                                th:data-original-unit-id="${item.measurement.measurementId}"
                                th:data-is-promotable="${item.measurement.isPromotable}"
                                th:data-ingredient-classification="${item.ingredient.classification.name()}"
                                th:text="${T(com.braindribbler.recipe.util.RecipeUtility).convertDecimalToKitchenFraction(item.amount)}">2</strong>

                        <span class="scalable-unit-name" 
                              th:data-original-unit-name="${item.measurement.unitName}" 
                              th:text="${item.measurement.unitName}">Pint</span>

                        <span class="oz-package-preview"></span>
                        
                        <span class="ingredient-note" 
                            th:if="${item.ingredientNote != null && !#strings.isEmpty(item.ingredientNote)}" 
                            th:text="' - [' + ${item.ingredientNote} + ']'">Some Note</span>
                    </span>
                </div>
            </li>
        </ul>
    </div>
</div>
