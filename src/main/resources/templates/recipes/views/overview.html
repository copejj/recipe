<div th:fragment="overview-panel" class="recipe-view-panel">

    <!-- 1. COMBINED MASTER INGREDIENTS CHECKLIST SUMMARY BOX -->
    <div class="recipe-ingredient-card-panel">
        <h4 class="recipe-panel-heading">Ingredient Checklist</h4>

        <ul class="recipe-ingredient-list grid-list-modifier">
            <th:block th:each="categoryGroup : ${singleRecipeAggregatedIngredients}">
                <li th:each="item : ${categoryGroup.value}" class="recipe-ingredient-row">
                    <th:block th:replace="~{fragments/ingredient-checklist :: itemQuantityBlock(${item.amount}, ${item.measurement}, ${item.ingredient}, false)}"></th:block>
                    <strong class="ingredient-name" th:text="${item.ingredient.ingredientName}">Flour</strong>
                    
                    <span class="ingredient-note" 
                          th:if="${item.ingredientNote != null && !#strings.isEmpty(item.ingredientNote)}" 
                          th:text="' - [' + ${item.ingredientNote} + ']'">Some Note</span>
                </li>
            </th:block>
        </ul>
    </div>

    <!-- 2. TRADITIONAL CONTINUOUS TIMELINE READING BLOCK -->
    <div class="overview-steps-timeline">
        <h4 class="recipe-panel-heading">Preparation Instructions</h4>
        <ol>
            <li th:each="step : ${recipe.steps}" th:text="${step.instructionText}"></li>
        </ol>
    </div>

    <!-- 3. GENERAL RECIPE CHEF NOTES FOOTER CARD -->
    <div th:if="${recipe.recipeNote != null && !recipe.recipeNote.trim().isEmpty()}" class="chef-notes-footer-card">
        <h4 class="chef-notes-heading">Notes</h4>
        <p class="chef-notes-footer-text" th:text="${recipe.recipeNote}"></p>
    </div>

</div>
