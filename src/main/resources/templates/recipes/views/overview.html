<!-- 📁 templates/recipes/views/overview.html -->
<div th:fragment="overview-panel">

    <!-- Meta Summary Subtitle Section -->
    <div style="margin-bottom: 24px;">
        <p class="recipe-description-text" th:text="${recipe.description}"
            style="font-size: 1.15rem; line-height: 1.6; font-style: italic; color: var(--color-text-muted); margin-bottom: 12px;">
        </p>

        <!-- GENERAL INLINE RECIPE AUTHOR PROGRESS NOTES -->
        <div th:if="${recipe.recipeNote != null && !recipe.recipeNote.trim().isEmpty()}"
            style="margin-top: 16px; padding: 14px 18px; background-color: rgba(13, 110, 253, 0.05); border-left: 4px solid #0d6efd; border-radius: 4px; color: var(--color-text-dark);">
            <strong
                style="display: block; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; color: #0d6efd; margin-bottom: 4px;">💡
                Author Notes:</strong>
            <span th:text="${recipe.recipeNote}"></span>
        </div>
    </div>

    <!-- Combined Master Ingredients Checklist Summary Box -->
    <div
        style="margin-bottom: 30px; padding: 24px; background-color: var(--color-bg-card); border-radius: 8px; border: 1px solid var(--color-border);">
        <h4
            style="margin-top: 0; margin-bottom: 16px; font-size: 1.15rem; color: var(--color-text-dark); border-bottom: 1px solid var(--color-border); padding-bottom: 8px;">
            🛒 Complete Ingredient Checklist</h4>
        <ul
            style="columns: 2; padding-left: 20px; margin: 0; list-style-type: square; color: var(--color-text-label); line-height: 1.8;">
            <!-- CORRECTED LOOP VARIABLE NAME FROM entry TO item TO MATCH PROPERTIES -->
            <th:block th:each="item : ${singleRecipeAggregatedIngredients}">
                <li>
                    <span class="scalable-amount" th:data-base-amount="${item.amount}"
                        th:data-base-type-id="${item.measurement.baseType.baseTypeId}"
                        th:data-base-unit-equivalent="${item.measurement.baseUnitEquivalent}"
                        th:data-original-unit-name="${item.measurement.unitName}"
                        th:text="${T(com.braindribbler.recipe.util.RecipeUtility).convertDecimalToKitchenFraction(item.amount)}">1</span>

                    <span class="scalable-unit-name" th:text="${item.measurement.unitName}">cups</span> of
                    <strong th:text="${item.ingredient.ingredientName}">Flour</strong>
                    <!-- Target element anchor for Imperial display packaging updates -->
                    <span class="oz-package-preview"></span>
                </li>
            </th:block>
        </ul>
    </div>

    <!-- Traditional Continuous Timeline Reading Block -->
    <div class="overview-steps-timeline">
        <h4 style="color: var(--color-text-dark); font-size: 1.15rem; margin-bottom: 16px;">📋 Preparation Instructions
        </h4>
        <ol style="padding-left: 20px; line-height: 1.75; color: var(--color-text-dark); font-size: 1.05rem;">
            <li th:each="step : ${recipe.steps}" th:text="${step.instructionText}"
                style="margin-bottom: 14px; padding-left: 6px;"></li>
        </ol>
    </div>

</div>
