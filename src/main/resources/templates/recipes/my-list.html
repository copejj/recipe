<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz"
      layout:decorate="~{fragments/layout}"
      lang="en">
<head>
    <title>My Recipes</title>
    <th:block layout:fragment="page_styles">
        <link rel="stylesheet" th:href="@{/css/recipes/cookbook.css}" />
    </th:block>
</head>

<body>
    <div layout:fragment="page-title">My Cookbook</div>
    <p layout:fragment="page-subtitle">
        Browse, review, or modify your library. Tap or click any recipe row to view it
        , or click a <em>Category</em> or <em>Chef</em> badge to filter and unfilter.
    </p>
    
    <main layout:fragment="content">
        <div class="action-bar">
            <th:block th:fragment="cookbookButtons">
                <a th:href="@{/recipes/create}" class="btn btn--primary btn-add-recipe">
                    + Add Recipe
                </a>
            </th:block>
        </div>

        <div class="notifications-wrapper">
            <div th:if="${successMessage}" class="alert alert--success">
                <span class="alert-icon">💾</span> 
                <span th:text="${successMessage}">Success!</span>
            </div>
            <div th:if="${errorMessage}" class="alert alert--error">
                <span class="alert-icon">⚠️</span> 
                <span th:text="${errorMessage}">Error!</span>
            </div>
        </div>

        <div th:replace="~{fragments/datatable :: genericTableFull(
            'generalCookbookTable', 
            ${recipes}, 
            ~{::recipeHeaders}, 
            ~{::recipeRows},
            '',
            true
        )}">

            <!-- Table Headers Slot -->
            <tr th:fragment="recipeHeaders">
                <th>Category</th>
                <th>Chef</th>
                <th>Title</th>
                <th>Summary</th>
                <th>Visibility</th>
            </tr>

            <!-- Table Rows Slot -->
            <tr th:fragment="recipeRows" 
                th:data-href="@{/view/{id}(id=${item.recipeId})}"
                th:classappend="${iterStat != null and iterStat.even} ? 'row-even' : ''"
                class="recipe-table-row">
                
                <td data-label="Category" class="table-category-cell">
                    <span class="badge-permission table-category-badge clickable-category-badge" 
                          th:text="${item.recipeCategory != null ? item.recipeCategory.name : 'General'}">General</span>
                </td>
                <td data-label="Chef" class="table-display-name-cell">
                    <span class="badge-permission table-chef-badge clickable-chef-badge" 
                          th:text="${item.user.displayName != null ? item.user.displayName : 'Anonymous'}">Anonymous</span>
                </td>
                <td data-label="Title" class="table-title-cell">
                    <a th:href="@{/view/{id}(id=${item.recipeId})}" 
                       th:text="${item.title}" 
                       class="recipe-title-link">Title</a>
                </td>
                <td data-label="Summary" class="table-description-cell"
                    th:text="${item.description != null && !item.description.isEmpty() ? item.description : 'No description provided.'}">Description</td>
                <td data-label="Visibility" class="recipe-visibility-cell">
                    <span class="badge-permission table-visibility-badge"
                          th:text="${item.recipeVisibility != null ? item.recipeVisibility.visibilityName : 'Public'}">Public</span>
                </td>
            </tr>
        </div>
    </main>

    <th:block layout:fragment="page_scripts">
        <script th:src="@{/js/recipes/cookbook.js}"></script>
    </th:block> 
</body>
</html>
