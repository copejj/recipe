<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" xmlns:sec="http://thymeleaf.org" lang="en">

<head th:replace="~{fragments/layout :: html_head('Pending Ingredient Moderation')}"></head>

<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page-card page-card--audit-layout">
        <div class="admin-header-flex">
            <div>
                <h1 class="page-title">Ingredient Moderation Queue</h1>
                <p class="page-subtitle" style="margin-bottom:0;">Review and verify user-submitted ingredients before
                    they appear globally.</p>
            </div>
        </div>

        <!-- Interactive Data Table Container -->
        <div class="table-responsive-wrapper" style="margin-top: 24px;">
            <table id="pendingIngredientsTable" class="dataTable stripe hover row-border">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Ingredient Name</th>
                        <th>Grocery Category</th>
                        <th>Submitted By</th>
                        <th>Date Created</th>
                        <th style="text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${pendingIngredients}">
                        <td class="audit-font-monospace" th:text="${item.ingredientId}">1</td>
                        Unverified Ingredient</td>
                        <td>
                            <span class="badge-permission" th:text="${item.categoryName}">Produce</span>
                        </td>
                        <td class="audit-user-id"
                            th:text="${item.createdByUsername != null ? item.createdByUsername : 'System'}">user123</td>
                        <td th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm z')}">2026-10-14 10:30 UTC
                        </td>
                        <td class="actions-cell">
                            <form th:action="@{/admin/ingredients/verify}" method="post" class="audit-action-form">
                                <input type="hidden" name="id" th:value="${item.ingredientId}" />
                                <button type="submit"
                                    class="btn btn--unblock-override btn--table-action status-text--verified">
                                    Approve & Verify
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <!-- Initialize Project DataTables Styling Framework -->
    <script>
        $(document).ready(function () {
            $('#pendingIngredientsTable').DataTable({
                "order": [[4, "asc"]], // Sort by oldest creation date first
                "pageLength": 10,
                "columnDefs": [
                    { "orderable": false, "targets": 5 } // Disable sorting on the actions row
                ]
            });
        });
    </script>
</body>

</html>
