<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz"
      layout:decorate="~{fragments/layout}"
      th:with="isNarrow=true,isHeaderless=true"
      lang="en">

<head>
    <title>Forgot Password</title>
</head>

<body>
    <main layout:fragment="content" class="page-card auth-layout">
        <div class="auth-container">
            <h1 class="page-title auth-centered">Reset Password</h1>
            <p class="page-subtitle auth-centered auth-header-spacing">Enter your email to receive a recovery link</p>

            <!-- Notification Alerts -->
            <div th:if="${successMessage}" class="alert alert--info" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert--danger" th:text="${errorMessage}"></div>

            <form th:action="@{/password/forgot}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group form-group--last">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-input" required
                        placeholder="recipe@braindribbler.com" autocomplete="email" />
                </div>

                <button type="submit" class="btn btn--primary">Send Reset Link</button>
            </form>

            <div class="auth-footer-links">
                <p class="auth-footer-text">
                    Remember your credentials? <a th:href="@{/login}" class="auth-link">Back to Sign In</a>
                </p>
            </div>
        </div>
    </main>
</body>

</html>
