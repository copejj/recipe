<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz"
      layout:decorate="~{fragments/layout}"
      th:with="isNarrow=true,isHeaderless=true"
      lang="en">
<head>
    <title>Reset Password</title>
</head>

<body>
    <main layout:fragment="content" class="page-card auth-layout">
        <div class="auth-container">
            <h1 class="page-title auth-centered">New Password</h1>
            <p class="page-subtitle auth-centered auth-header-spacing">Create a secure password for your account</p>

            <!-- Validation Error Alerts -->
            <div th:if="${errorMessage}" class="alert alert--danger" th:text="${errorMessage}"></div>

            <form th:action="@{/password/reset}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <!-- Hidden payload forwarding the UUID token context safely -->
                <input type="hidden" name="token" th:value="${token}" />

                <div class="form-group">
                    <label for="password" class="form-label">New Password</label>
                    <input type="password" id="password" name="password" class="form-input" required placeholder="••••••••"
                        minlength="8" />
                </div>

                <div class="form-group form-group--last">
                    <label for="confirmPassword" class="form-label">Confirm New Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" required
                        placeholder="••••••••" minlength="8" />
                </div>

                <button type="submit" class="btn btn--primary">Update Password</button>
            </form>
        </div>
    </main>
</body>
</html>
