<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz"
      layout:decorate="~{fragments/layout}"
      lang="en">

<head>
    <title>My Profile</title>
    <th:block layout:fragment="page_styles">
        <link rel="stylesheet" th:href="@{/css/admin/auth.css}" />
    </th:block>
</head>

<body>
    <h1 layout:fragment="page-title">My Profile</h1>
    <p layout:fragment="page-subtitle">Manage your account details, security settings, and recipe activity.</p>

    <main layout:fragment="content">
        <!-- Dynamic Success/Error Alerts -->
        <div th:if="${successMessage}" class="alert alert--success" th:text="${successMessage}"></div>
        <div th:if="${infoMessage}" class="alert alert--info" th:text="${infoMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert--danger" th:text="${errorMessage}"></div>

        <!-- PROFILE TABS NAVIGATION -->
        <div class="view-mode-tabs" role="tablist" aria-label="Profile sections">
            <button type="button" class="tab-btn active" role="tab" aria-selected="true" data-target="user-data-panel">
                Account &amp; Security
            </button>
            <button type="button" class="tab-btn" role="tab" aria-selected="false" data-target="user-stats-panel">
                Recipe Stats
            </button>
        </div>

        <!-- TAB 1: User Information & Security -->
        <div id="user-data-panel" class="tab-panel active-panel">
            <div th:insert="~{auth/user/data :: user-data-panel}"></div>
        </div>

        <!-- TAB 2: User Recipe Stats -->
        <div id="user-stats-panel" class="tab-panel" style="display: none;">
            <div th:insert="~{auth/user/stats :: user-stats-panel}"></div>
        </div>
    </main>

    <th:block layout:fragment="page_scripts">
        <script th:src="@{/js/admin/auth.js}"></script>
        <script th:src="@{/js/fragments/recipe-stats.js}"></script>
    </th:block>
</body>
</html>
