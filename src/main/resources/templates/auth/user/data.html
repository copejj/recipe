<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">
<body>
    <th:block th:fragment="user-data-panel">
        <div class="profile-card">
            <!-- SECTION 1: Personal Details Form -->
            <h3 class="profile-section-title">Personal Details</h3>
            <form th:action="@{/profile/details/update}" method="post" class="profile-form-block">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group">
                    <label class="form-label">Email Address (Username)</label>
                    <input type="text" class="form-input profile-input-disabled" th:value="${email}" disabled />
                    <small class="profile-input-hint">Account emails cannot be altered dynamically.</small>
                </div>
                <div class="form-group">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" id="firstName" name="firstName" class="form-input" required
                        th:value="${user.firstName}" />
                </div>
                <div class="form-group">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" id="lastName" name="lastName" class="form-input" required
                        th:value="${user.lastName}" />
                </div>
                <div class="form-group">
                    <label for="displayName" class="form-label">Display Name</label>
                    <input type="text" id="displayName" name="displayName" class="form-input" required
                        th:value="${user.displayName}" />
                </div>
                <button type="submit" class="btn btn--primary">Save Changes</button>
            </form>

            <!-- SECTION 2: Password Modification Form -->
            <h3 class="profile-section-title">Security Settings</h3>
            <form th:action="@{/profile/password/change}" method="post" class="profile-form-block">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group">
                    <label for="currentPassword" class="form-label">Current Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="currentPassword" name="currentPassword" class="form-input" required
                            placeholder="••••••••" autocomplete="current-password" />
                        <button type="button" data-toggle-password="currentPassword" class="password-toggle-btn" aria-label="Show password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="newPassword" class="form-label">New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="newPassword" name="newPassword" class="form-input" required
                            placeholder="••••••••" minlength="8" autocomplete="new-password" />
                        <button type="button" data-toggle-password="newPassword" class="password-toggle-btn" aria-label="Show password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" required
                            placeholder="••••••••" minlength="8" autocomplete="new-password" />
                        <button type="button" data-toggle-password="confirmPassword" class="password-toggle-btn" aria-label="Show password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn--primary profile-password-btn">Update Password</button>
            </form>

            <!-- SECTION 3: Device Management (Logout All) -->
            <h3 class="profile-section-title">Device Sessions</h3>
            <div class="device-management-box">
                <p class="device-management-text">
                    Logged into your account on a public computer or lost a device? Terminating your sessions logs out every device currently using your account (including this one).
                </p>
                <form th:action="@{/account/logout-all}" method="post" data-confirm="Are you sure you want to log out of all devices? You will be signed out immediately.">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn--terminate-sessions">
                        Log Out of All Devices
                    </button>
                </form>
            </div>
        </div>
    </th:block>
</body>

</html>
