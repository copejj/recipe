<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">

<head th:replace="~{fragments/layout :: html_head('Forgot Password - Braindribbler')}"></head>

<body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main class="page-card auth-layout">
        <h1 class="page-title auth-centered">Reset Password</h1>
        <p class="page-subtitle auth-centered auth-header-spacing">Enter your email to receive a recovery link</p>

        <!-- Notification Alerts -->
        <div th:if="${successMessage}" class="alert alert--info" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert--danger" th:text="${errorMessage}"></div>

        <form th:action="@{/forgot-password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group form-group--last">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" required
                    placeholder="recipe@braindribbler.com" autocomplete="email" />
            </div>

            <button type="submit" class="btn btn--primary">Send Reset Link</button>
        </form>

        <p class="auth-footer-text">Remember your credentials? <a th:href="@{/login}" class="auth-link">Back to Sign
                In</a></p>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>

</html>
