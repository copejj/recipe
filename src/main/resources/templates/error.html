<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz"
      layout:decorate="~{fragments/layout}"
      lang="en">

<head>
    <!-- Hardcoded static values here guarantee the template compiler won't crash on null variables -->
    <title>Whoops</title>
    <meta name="page-title" content="Something Went Wrong" />
    <meta name="page-subtitle" content="Our recipe engine encountered an unexpected kitchen error." />
</head>
<body>

    <!-- This matches the layout:fragment content slot placeholder inside fragments/layout.html -->
    <main layout:fragment="content" class="page-card page-card--error" 
          th:classappend="${showTechnicalDetails} ? 'other-layout' : 'auth-layout'">

        <!-- Real Dynamic Details are rendered inside the body card container via safe ternary check wrappers -->
        <div style="background: #fdfbfc; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid #e7e5e4;">
            <div class="error-code" style="font-size: 3.5rem; font-weight: 800; color: #d97706; line-height: 1;"
                 th:text="${status} ? ${status} : 'Error'">500</div>
                 
            <h2 style="margin: 1rem 0 0.5rem 0; font-size: 1.5rem; color: #292524;" 
                th:text="${error} ? ${error} : 'Unexpected Exception'">Unexpected Error</h2>
                
            <p style="margin: 0; color: #78716c;" 
               th:text="${message} ? ${message} : 'An error occurred while processing your request.'">
               An error occurred while processing your request.
            </p>
        </div>

        <!-- Dynamic Action Navigation Buttons -->
        <div class="error-actions" style="margin: 1.5rem 0;">
            <a th:href="@{/}" class="btn btn--primary btn--error-home" style="width: auto; padding: 10px 24px;">Return to Kitchen Home</a>
        </div>

        <!-- Admin/Developer Debug Dashboard Fragment mapped to native alerts -->
        <div th:if="${showTechnicalDetails}" class="admin-debug-panel alert alert--danger" style="text-align: left; margin-top: 2rem;">

            <h4 class="debug-header" style="margin-top: 0; border-bottom: 1px solid var(--color-danger-text); padding-bottom: 0.5rem;">
                <span>🔒 Admin Debug Dashboard</span>
                <span class="badge-debug-status" style="font-size: 0.8rem; background: var(--color-danger-text); color: #fff; padding: 2px 6px; border-radius: 3px;">can_view_errors active</span>
            </h4>

            <!-- NATIVE ACCORDION CONTEXT TOGGLE -->
            <details class="debug-accordion" style="cursor: pointer; margin-top: 1rem;">
                <summary class="debug-summary" style="font-weight: bold; padding: 0.5rem 0; outline: none; user-select: none;">
                    ▶ Click to toggle Terminal Console Stack Trace Dump
                </summary>

                <!-- THE SCROLLABLE FRAME -->
                <pre class="debug-stacktrace" th:text="${trace} ? ${trace} : ${stackTrace}"
                     style="display: block; max-height: 250px; overflow: auto; background-color: #292524; color: #f5f5f4; padding: 1rem; border-radius: 6px; font-size: 0.85rem; line-height: 1.4rem; white-space: pre; font-family: monospace; text-align: left;"></pre>
            </details>
        </div>

    </main>

</body>
</html>
