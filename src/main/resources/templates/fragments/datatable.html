<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
    <div th:fragment="genericTable(tableId, dataList, headerTemplate, rowTemplate)"
         th:replace="~{::genericTableWithClass(${tableId}, ${dataList}, ${headerTemplate}, ${rowTemplate}, '')}">
    </div>

    <div th:fragment="genericTableWithClass(tableId, dataList, headerTemplate, rowTemplate, customClass)"
         class="table-responsive-wrapper"
         style="margin-top: 24px;">

        <link rel="stylesheet" type="text/css" th:href="@{/css/fragments/datatable.css}" />

        <table th:id="${tableId}"
               class="dataTable stripe hover row-border"
               th:classappend="${customClass != null and !customClass.isEmpty()} ? ' ' + ${customClass} : ''">
            <thead>
                <!-- Dynamically inserts the headers passed from the parent component -->
                <tr th:replace="${headerTemplate}"></tr>
            </thead>
            <tbody>
                <!-- Iterates through the generalized collection -->
                <th:block th:each="item, iterStat : ${dataList}">
                    <!-- Dynamically inserts the row configuration, passing the current iteration item -->
                    <th:block th:replace="${rowTemplate}"></th:block>
                </th:block>
            </tbody>
        </table>

        <!-- 2. Self-Contained Initialization Script -->
        <script th:inline="javascript">
            $(document).ready(function () {
                var targetTableId = /*[[${tableId}]]*/ 'genericTable';

                $('#' + targetTableId).DataTable({
                    "paging": true,
                    "searching": true,
                    "ordering": true,
                    "info": true,
                    "pageLength": -1,
                    "lengthMenu": [ [10, 25, 50, -1], [10, 25, 50, "All"] ],
                    "language": {
                        "emptyTable": "No data available in table"
                    },
                });
            });
        </script>
    </div>
</body>
</html>
