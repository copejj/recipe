<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<body>

<!-- =========================================================================
     1. SHARED QUANTITY, PLURAL UNIT & OZ PACKAGE PREVIEW FRAGMENT
     ========================================================================= -->
<th:block th:fragment="itemQuantityBlock(amount, measurement, ingredient, showDash)">
    <span th:if="${amount != null && amount.compareTo(T(java.math.BigDecimal).ZERO) > 0}"
          class="ingredient-quantity-group">
        <th:block th:if="${showDash}"> - </th:block>
        <strong class="scalable-amount"
                th:data-base-amount="${amount}"
                th:data-base-type-id="${measurement != null && measurement.baseType != null ? measurement.baseType.baseTypeId : ''}"
                th:data-base-unit-equivalent="${measurement != null ? measurement.baseUnitEquivalent : ''}"
                th:data-original-unit-id="${measurement != null ? measurement.measurementId : ''}"
                th:data-is-promotable="${measurement != null ? measurement.isPromotable : false}"
                th:data-ingredient-classification="${ingredient != null && ingredient.classification != null ? ingredient.classification.name() : 'DRY'}"
                th:text="${T(com.braindribbler.recipe.util.RecipeUtility).convertDecimalToKitchenFraction(amount)}">2</strong>

        <span th:if="${measurement != null}"
              class="scalable-unit-name"
              th:data-original-unit-name="${measurement.unitName}"
              th:text="${measurement.unitName.equalsIgnoreCase('whole') ? '' : (amount.compareTo(T(java.math.BigDecimal).ONE) <= 0 ? measurement.unitName : (measurement.pluralName != null && !measurement.pluralName.isBlank() ? measurement.pluralName : measurement.unitName))}">Cups</span>

        <span class="oz-package-preview"></span>
    </span>
</th:block>

<th:block th:fragment="persistentShoppingChecklist(itemsByAisle, shoppingList, canEdit, isShared)">
    <div th:each="entry : ${itemsByAisle}" class="shopping-category-section">
        <h4 class="recipe-panel-heading" th:text="${entry.key}">Produce</h4>

        <ul class="recipe-ingredient-list standard-list-reset">
            <li th:each="item : ${entry.value}"
                th:data-item-id="${item.shoppingListItemId}"
                th:data-hidden="${item.isHidden}"
                th:data-manual="${item.isManualAddition}"
                th:classappend="${(item.isQuestioned ? ' is-questioned-row' : '') + (item.isHidden ? ' is-hidden-item hide-cell' : '')}"
                class="recipe-ingredient-row shopping-item-modifier shopping-row-flex">

                <div class="shopping-item-content">
                    <!-- Left Slot: Either Circular Green + (if skipped) OR Checkbox (if active) -->
                    <button type="button"
                            th:if="${canEdit}"
                            th:data-item-id="${item.shoppingListItemId}"
                            th:classappend="${!item.isHidden} ? ' hide-cell' : ''"
                            class="btn-restore-circle js-restore-item-btn"
                            aria-label="Restore item to list"
                            title="Unskip item">+</button>

                    <label class="shopping-item-label">
                        <input type="checkbox"
                               class="shopping-item-checkbox"
                               th:checked="${item.isChecked}"
                               th:disabled="${item.isHidden}"
                               th:classappend="${item.isHidden} ? ' hide-cell' : ''"
                               th:data-item-id="${item.shoppingListItemId}" />

                        <span class="shopping-item-text" th:classappend="${item.isChecked} ? 'crossed-out-text' : ''">
                            <span th:text="${item.displayName}" class="ingredient-name">Chicken Broth</span>

                            <th:block th:replace="~{fragments/ingredient-checklist :: itemQuantityBlock(${item.amount}, ${item.measurement}, ${item.ingredient}, true)}"></th:block>

                            <span class="ingredient-note"
                                  th:if="${item.note != null && !item.note.isBlank()}"
                                  th:text="' - [' + ${item.note} + ']'"></span>

                            <span th:if="${item.isManualAddition}" class="badge-extra-item">Extra</span>
                            <span th:if="${item.isHidden}" class="badge-skipped-item">Skipped</span>
                        </span>
                    </label>
                </div>

                <div class="shopping-row-controls">
                    <!-- Question Mark Button + Speech Bubbles -->
                    <div th:if="${isShared}"
                         th:classappend="${item.isChecked or item.isHidden} ? ' hide-cell' : ''"
                         class="question-control-wrap">
                        <span class="chat-bubble chat-bubble--question"
                              th:classappend="${!item.isQuestioned} ? ' hide-cell' : ''">
                            Do we have this already?
                        </span>
                        <span class="chat-bubble chat-bubble--muted js-not-found-bubble hide-cell">
                            Not found
                        </span>
                        <button type="button"
                                class="btn-question-circle js-toggle-question-btn"
                                th:classappend="${item.isQuestioned} ? ' is-active' : ''"
                                th:aria-pressed="${item.isQuestioned}"
                                th:data-item-id="${item.shoppingListItemId}"
                                title="Ask: Do we have this already?">?</button>
                    </div>


                    <!-- Two-Step Delete (Manual items) or Soft-Hide (Meal Plan items) -->
                    <form th:if="${canEdit}"
                          th:action="@{/shopping-lists/{lid}/items/{iid}/delete(lid=${shoppingList.publicId}, iid=${item.shoppingListItemId})}"
                          method="post"
                          th:classappend="${item.isChecked or item.isHidden} ? ' hide-cell' : ''"
                          class="inline-form-reset delete-confirm-wrap js-item-remove-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <span class="chat-bubble chat-bubble--danger js-confirm-bubble hide-cell">Sure?</span>
                        <button type="submit"
                                th:data-item-id="${item.shoppingListItemId}"
                                th:data-manual="${item.isManualAddition}"
                                class="btn btn-action btn-action--delete js-confirm-remove-btn"
                                title="Remove or skip item">✕</button>
                    </form>
                </div>
            </li>
        </ul>
    </div>
</th:block>

<!-- =========================================================================
     3. RECIPE ITEM LIST CHECKLIST (recipes/views/list.html)
     ========================================================================= -->
<th:block th:fragment="recipeItemChecklist(aggregatedIngredients)">
    <div th:each="entry : ${aggregatedIngredients}" class="shopping-category-section">
        <h4 class="recipe-panel-heading" th:text="${entry.key}">Produce</h4>

        <ul class="recipe-ingredient-list standard-list-reset">
            <li th:each="item : ${entry.value}" class="recipe-ingredient-row shopping-item-modifier">
                <label class="shopping-item-content">
                    <input type="checkbox"
                           class="shopping-item-checkbox"
                           th:data-item-key="${item.ingredient.ingredientId != null ? item.ingredient.ingredientId : item.ingredient.ingredientName}" />

                    <span class="shopping-item-text">
                        <span th:text="${item.ingredient.ingredientName}" class="ingredient-name">Chicken Broth</span>

                        <th:block th:replace="~{fragments/ingredient-checklist :: itemQuantityBlock(${item.amount}, ${item.measurement}, ${item.ingredient}, true)}"></th:block>

                        <span class="ingredient-note"
                              th:if="${item.ingredientNote != null && !#strings.isEmpty(item.ingredientNote)}"
                              th:text="' - [' + ${item.ingredientNote} + ']'">Some Note</span>
                    </span>
                </label>
            </li>
        </ul>
    </div>
</th:block>

</body>
</html>
