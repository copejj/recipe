<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org" lang="en">

<head th:fragment="html_head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title}">Braindribbler Recipes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>

    <link rel="stylesheet" href="https://cdn.datatables.net/3.1.3/css/dataTables.dataTables.min.css" />
    <script src="https://cdn.datatables.net/3.1.3/js/dataTables.min.js"></script>
</head>

<body>

    <!-- Unified Header Fragment -->
    <header th:fragment="header" class="main-header">
        <div class="header-container">
            <h3 class="header-logo">
                <a th:href="@{/}">Braindribbler Recipes</a>
            </h3>

            <!-- Navigation: Guest User -->
            <nav sec:authorize="!isAuthenticated()" class="header-nav">
                <a th:href="@{/}" class="nav-link">Home</a>
                <a th:href="@{/search}" class="nav-link">Search</a>

                <a th:href="@{/login}" class="nav-link nav-link--cta">Sign In</a>
            </nav>

            <!-- Navigation: Logged-In User -->
            <nav sec:authorize="isAuthenticated()" class="header-nav">
                <a th:href="@{/dashboard}" class="nav-link">Home</a>
                <a th:href="@{/search}" class="nav-link">Search</a>

                <!-- Dynamic Admin Dropdown Menu Options Block -->
                <!-- Only renders if the collection list exists and isn't empty -->
                <div class="nav-dropdown" th:if="${adminMenuItems != null and !adminMenuItems.empty}">
                    <button type="button" class="nav-button nav-link nav-link--cta">
                        Admin <span class="dropdown-caret">▼</span>
                    </button>

                    <!-- Dropdown Link Flyout Options Box -->
                    <div class="dropdown-menu">
                        <!-- Dynamically loops over the array provided by GlobalNavigationAdvice -->
                        <a th:each="item : ${adminMenuItems}" th:href="@{${item.url}}" class="dropdown-item"
                            th:text="${item.label}">Dynamic Option</a>
                    </div>
                </div>

                <form th:action="@{/logout}" method="post" class="nav-logout-form">
                    <button type="submit" class="nav-button nav-button--cta">
                        Sign Out
                    </button>
                </form>
            </nav>
        </div>
    </header>

    <!-- Unified Footer Fragment -->
    <footer th:fragment="footer" class="main-footer">
        <div class="footer-container">
            <p>&copy; 2026 Braindribbler Recipes. All rights reserved.</p>
            <p th:if="${showGitInfo}" class="footer-git-info">
                Version: <span th:text="${gitBranch}">main</span> (<span th:text="${gitHash}">abcdefg</span>)
            </p>
        </div>
    </footer>

</body>

</html>
