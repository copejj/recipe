<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" xmlns:sec="http://thymeleaf.org/extras/spring-security" lang="en">

<head th:fragment="html_head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title}">Braindribbler Recipes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>

    <!-- Unified Header Fragment -->
    <header th:fragment="header" class="main-header">
        <div class="header-container">
            <h3 class="header-logo">
                <a th:href="@{/}">Braindribbler Recipes</a>
            </h3>

            <!-- Navigation: Guest User -->
            <nav sec:authorize="!isAuthenticated()" class="header-nav">
                <a th:href="@{/}" class="nav-link">Home</a>
                <a th:href="@{/search}" class="nav-link">Search</a>
                <a th:href="@{/login}" class="nav-link nav-link--cta">Sign In</a>
            </nav>

            <!-- Navigation: Logged-In User -->
            <nav sec:authorize="isAuthenticated()" class="header-nav">
                <a th:href="@{/dashboard}" class="nav-link">Home</a>
                <a th:href="@{/search}" class="nav-link">Search</a>
                <form th:action="@{/logout}" method="post" class="nav-logout-form">
                    <button type="submit" class="nav-button nav-button--cta">
                        Sign Out
                    </button>
                </form>
            </nav>
        </div>
    </header>

    <!-- Unified Footer Fragment -->
    <footer th:fragment="footer" class="main-footer">
        <div class="footer-container">
            <p>&copy; 2026 Braindribbler Recipes. All rights reserved.</p>
            <p th:if="${showGitInfo}" class="footer-git-info">
                Version: <span th:text="${gitBranch}">main</span> (<span th:text="${gitHash}">abcdefg</span>)
            </p>
        </div>
    </footer>

</body>

</html>
