<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org" lang="en">

<head th:fragment="html_head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title}">Braindribbler Recipes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://cdn.datatables.net/3.1.3/css/dataTables.dataTables.min.css" />
    <script src="https://cdn.datatables.net/3.1.3/js/dataTables.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.1.0/css/select2.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.1.0/js/select2.min.js"></script>

</head>

<body>
    <!-- Unified Header Fragment -->
    <header th:fragment="header" class="main-header">
        <div class="header-container">
            <h3 class="header-logo">
                <a th:href="@{/}">Braindribbler Recipes</a>
            </h3>

            <nav class="header-nav">
                <!-- Loop through the globally provided list -->
                <th:block th:each="item : ${globalMenuItems}">

                    <!-- If item has child links, render it as a Dropdown Menu Block -->
                    <div class="nav-dropdown" th:if="${item.hasChildren()}">
                        <button type="button" class="nav-button nav-link nav-link--cta">
                            <span th:text="${item.label}">Dropdown Title</span>
                            <span class="dropdown-caret">▼</span>
                        </button>
                        <div class="dropdown-menu">
                            <a th:each="child : ${item.children}" th:href="@{${child.url}}" class="dropdown-item"
                                th:text="${child.label}">Child Option</a>
                        </div>
                    </div>

                    <!-- If item is a normal standalone link, render standard tag -->
                    <a th:if="${!item.hasChildren()}" th:href="@{${item.url}}" class="nav-link"
                        th:text="${item.label}">Standard Link</a>

                </th:block>

                <!-- Keep your structural Sign Out button outside the loop for styling layout parity -->
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="nav-logout-form">
                    <button type="submit" class="nav-button nav-button--cta">
                        Sign Out
                    </button>
                </form>
                <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="nav-link nav-link--cta">Sign In</a>
            </nav>
        </div>
    </header>


    <!-- Unified Footer Fragment -->
    <footer th:fragment="footer" class="main-footer">
        <div class="footer-container">
            <p>&copy; 2026 Braindribbler Recipes. All rights reserved.</p>
            <p th:if="${showGitInfo}" class="footer-git-info">
                Version: <span th:text="${gitBranch}">main</span> (<span th:text="${gitHash}">abcdefg</span>)
            </p>
        </div>
    </footer>

</body>

</html>
