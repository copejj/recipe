<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">

<head th:fragment="html_head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title}">Braindribbler Recipes</title>
</head>

<body>
    <header th:fragment="header"
        style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: #333; color: #fff;">
        <h3 style="margin: 0;">Braindribbler Recipes</h3>

        <nav style="display: flex; gap: 20px; align-items: center;">

            <!-- Public Menu Items (Always visible) -->
            <a th:href="@{/}" style="color: #fff; text-decoration: none;">Welcome</a>
            <a th:href="@{/recipes/search}" style="color: #fff; text-decoration: none;">Search</a>

            <!-- Private Menu Items (Visible only when logged in) -->
            <th:block sec:authorize="isAuthenticated()">
                <a th:href="@{/home}" style="color: #fff; text-decoration: none;">Dashboard</a>
            </th:block>

            <!-- Sign In Button (Visible only when logged out) -->
            <a sec:authorize="!isAuthenticated()" th:href="@{/login}"
                style="color: #ffc107; text-decoration: none; font-weight: bold;">Sign In</a>

            <!-- Sign Out Button (Visible only when logged in) -->
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post"
                style="margin: 0; display: inline;">
                <button type="submit"
                    style="background: none; border: none; color: #ffc107; text-decoration: underline; font-weight: bold; cursor: pointer; font-size: 1em; padding: 0;">
                    Sign Out
                </button>
            </form>

        </nav>
    </header>

    <footer th:fragment="footer"
        style="text-align: center; padding: 20px; color: #777; font-size: 0.9em; margin-top: 40px;">
        <p>&copy; 2026 Braindribbler Recipes. All rights reserved.</p>

        <!-- Render git metadata only if gitProperties is actively populated -->
        <p th:if="${showGitInfo}" style="font-size: 0.8em; color: #aaa; margin-top: 5px;">
            Version: <span th:text="${gitBranch}">main</span> (<span th:text="${gitHash}">abcdefg</span>)
        </p>
    </footer>
</body>

</html>
