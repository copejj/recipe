<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">
<body>
    <th:block th:fragment="share-panel">
        <div class="meal-plan-card-wide">
            <h3 class="profile-section-title">Share This Meal Plan</h3>
            <p>Shared collaborators can view this meal plan and check off or add items on its shopping list.</p>

            <form th:if="${isOwner}" th:action="@{/meal-plans/{id}/share(id=${plan.publicId})}" method="post" class="inline-flex-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group flex-field-grow">
                    <label class="form-label">User Email</label>
                    <input type="email" name="email" class="form-input" required placeholder="friend@example.com" />
                </div>

                <div class="form-group flex-field-med">
                    <label class="form-label">Permission</label>
                    <select name="accessLevelId" class="form-input">
                        <option th:each="lvl : ${accessLevels}"
                                th:value="${lvl.accessLevelId}"
                                th:text="${lvl.accessName}">VIEW</option>
                    </select>
                </div>

                <button type="submit" class="btn btn--primary">Share</button>
            </form>

            <h4 class="profile-section-title">People with Access</h4>
            <ul>
                <li><strong th:text="${plan.user.displayName}">Owner</strong> (Owner)</li>
                <li th:each="share : ${plan.shares}">
                    <span th:text="${share.sharedUser.displayName}">Collaborator</span>
                    — <span th:text="${share.accessLevel.accessName}">VIEW</span>
                </li>
            </ul>
        </div>
    </th:block>
</body>
</html>
