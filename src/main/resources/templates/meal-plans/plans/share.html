<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">
<body>
    <th:block th:fragment="share-panel">
        <div class="meal-plan-card-wide">
            <h3 class="profile-section-title">Share This Meal Plan</h3>
            <p>Shared collaborators can view this meal plan and check off or add items on its shopping list.</p>

            <form th:if="${isOwner}" th:action="@{/meal-plans/{id}/share(id=${plan.publicId})}" method="post" class="inline-flex-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group flex-field-grow">
                    <label for="targetUserId" class="form-label">Select Chef / User</label>
                    <select id="targetUserId" name="targetUserId" class="form-input select2-enable" required>
                        <option value="">-- Search by Display Name --</option>
                        <option th:each="u : ${shareableUsers}"
                                th:value="${u.userId}"
                                th:text="${u.displayName}">Chef Name</option>
                    </select>
                </div>

                <div class="form-group flex-field-med">
                    <label for="accessLevelId" class="form-label">Permission</label>
                    <select id="accessLevelId" name="accessLevelId" class="form-input">
                        <option th:each="lvl : ${accessLevels}"
                                th:value="${lvl.accessLevelId}"
                                th:text="${lvl.accessName}">VIEW</option>
                    </select>
                </div>

                <button th:replace="~{fragments/actions :: submitBtn('Share')}"></button>
            </form>

            <h4 class="profile-section-title">People with Access</h4>
            <div class="pool-item-row">
                <div>
                    <strong th:text="${plan.user.displayName}">Owner</strong>
                    <span class="badge-permission">OWNER</span>
                </div>
            </div>

            <div th:each="share : ${plan.shares}" class="pool-item-row">
                <div>
                    <strong th:text="${share.sharedUser.displayName}">Collaborator</strong>
                    <span class="badge-permission" th:text="${share.accessLevel.accessName}">VIEW</span>
                </div>

                <form th:if="${isOwner}"
                      th:action="@{/meal-plans/{id}/shares/{sid}/remove(id=${plan.publicId}, sid=${share.mealPlanShareId})}"
                      method="post" class="inline-form-reset">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-action btn-action--delete">Remove</button>
                </form>
            </div>
        </div>
    </th:block>
</body>
</html>
