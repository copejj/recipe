<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">
<body>
    <th:block th:fragment="schedule-panel">
        <div th:if="${scheduledMeals.isEmpty()}" class="alert alert--info">
            No meals scheduled yet.
            <span th:if="${canEdit}">
                Choose a recipe from your cookbook above and assign it to a
                <span th:text="${plan.isRecurring} ? 'day' : 'date'">day</span>!
            </span>
        </div>

        <!-- External form used via HTML5 form="editScheduledEntryForm" to avoid nested <form> tags -->
        <form th:if="${canEdit and !scheduledMeals.isEmpty()}"
              id="editScheduledEntryForm"
              method="post"
              class="hide-cell">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        </form>

        <form th:unless="${scheduledMeals.isEmpty()}"
              id="scheduledMealsForm"
              th:action="@{/meal-plans/{id}/shopping-list/generate(id=${plan.publicId})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div th:replace="~{fragments/datatable :: genericTableWithOrder(
                'scheduledMealsTable',
                ${scheduledMeals},
                ~{::scheduledMealHeaders},
                ~{::scheduledMealRow},
                '[[1, &quot;asc&quot;]]'
            )}">

                <th:block th:fragment="scheduledMealHeaders">
                    <tr>
                        <th class="col-check-narrow" data-orderable="false">Shop</th>
                        <th th:text="${plan.isRecurring} ? 'Day' : 'Date'">Day</th>
                        <th>Meal</th>
                        <th>Recipe</th>
                        <th>Servings</th>
                        <th th:if="${canEdit}" data-orderable="false">Actions</th>
                    </tr>
                </th:block>

                <th:block th:fragment="scheduledMealRow">
                    <tr th:with="effectiveServings=${item.servingsOverride != null ? item.servingsOverride : item.recipe.servings}"
                        th:data-href="@{/view/{id}(id=${item.recipe.recipeId}, servings=${item.servingsOverride != null ? item.servingsOverride : null})}"
                        th:classappend="${iterStat != null and iterStat.even} ? 'row-even' : ''"
                        class="clickable-admin-row">

                        <td data-label="Shop">
                            <input type="checkbox" name="selectedEntryIds" th:value="${item.mealPlanRecipeId}" checked />
                        </td>

                        <!-- DAY OR DATE CELL -->
                        <td th:data-label="${plan.isRecurring} ? 'Day' : 'Date'"
                            th:data-order="${plan.isRecurring ? item.dayOfWeek : item.scheduledDate}">
                            <span class="meal-view-val">
                                <span th:if="${plan.isRecurring}"
                                      th:text="${#strings.arraySplit('Monday,Tuesday,Wednesday,Thursday,Friday,Saturday,Sunday', ',')[item.dayOfWeek - 1]}">Monday</span>
                                <span th:unless="${plan.isRecurring}"
                                      th:text="${item.scheduledDate == null ? '' : (item.scheduledDate instanceof T(java.time.temporal.Temporal) ? #temporals.format(item.scheduledDate, 'MM/dd/yyyy') : #dates.format(item.scheduledDate, 'MM/dd/yyyy'))}">11/25/2026</span>
                            </span>

                            <th:block th:if="${canEdit}">
                                <select th:if="${plan.isRecurring}"
                                        name="dayOfWeek"
                                        form="editScheduledEntryForm"
                                        class="form-input inline-table-input meal-edit-val hide-cell"
                                        disabled>
                                    <option value="1" th:selected="${item.dayOfWeek == 1}">Monday</option>
                                    <option value="2" th:selected="${item.dayOfWeek == 2}">Tuesday</option>
                                    <option value="3" th:selected="${item.dayOfWeek == 3}">Wednesday</option>
                                    <option value="4" th:selected="${item.dayOfWeek == 4}">Thursday</option>
                                    <option value="5" th:selected="${item.dayOfWeek == 5}">Friday</option>
                                    <option value="6" th:selected="${item.dayOfWeek == 6}">Saturday</option>
                                    <option value="7" th:selected="${item.dayOfWeek == 7}">Sunday</option>
                                </select>

                                <input th:unless="${plan.isRecurring}"
                                       type="date"
                                       name="scheduledDate"
                                       th:value="${item.scheduledDate}"
                                       form="editScheduledEntryForm"
                                       class="form-input inline-table-input meal-edit-val hide-cell"
                                       disabled />
                            </th:block>
                        </td>

                        <!-- MEAL TYPE CELL -->
                        <td data-label="Meal">
                            <span class="badge-permission meal-view-val"
                                  th:text="${item.mealType != null ? item.mealType : 'Any'}">Dinner</span>

                            <select th:if="${canEdit}"
                                    name="mealType"
                                    form="editScheduledEntryForm"
                                    class="form-input inline-table-input meal-edit-val hide-cell"
                                    disabled>
                                <option value="Dinner" th:selected="${item.mealType == 'Dinner'}">Dinner</option>
                                <option value="Lunch" th:selected="${item.mealType == 'Lunch'}">Lunch</option>
                                <option value="Breakfast" th:selected="${item.mealType == 'Breakfast'}">Breakfast</option>
                                <option value="Snack" th:selected="${item.mealType == 'Snack'}">Snack</option>
                            </select>
                        </td>

                        <!-- RECIPE TITLE CELL -->
                        <td data-label="Recipe">
                            <a th:href="@{/view/{id}(id=${item.recipe.recipeId}, servings=${item.servingsOverride != null ? item.servingsOverride : null})}"
                            th:text="${item.recipe.title}"
                            class="pool-item-title">Recipe Title</a>
                        </td>


                        <!-- SERVINGS CELL -->
                        <td data-label="Servings">
                            <span class="meal-view-val"
                                  th:text="${item.servingsOverride != null ? item.servingsOverride : item.recipe.servings}">4</span>

                            <input th:if="${canEdit}"
                                   type="number"
                                   name="servingsOverride"
                                   min="1"
                                   th:value="${item.servingsOverride != null ? item.servingsOverride : item.recipe.servings}"
                                   th:placeholder="${item.recipe.servings}"
                                   form="editScheduledEntryForm"
                                   class="form-input inline-table-input inline-table-input--sm meal-edit-val hide-cell"
                                   disabled />
                        </td>

                        <!-- ACTIONS CELL -->
                        <td th:if="${canEdit}" data-label="Actions" class="actions-cell">
                            <div class="inline-action-group meal-view-val">
                                <button type="button"
                                        class="btn btn-action btn-action--secondary js-edit-meal-btn">
                                    Edit
                                </button>
                                <button type="submit"
                                        th:formaction="@{/meal-plans/{id}/entries/{eid}/remove(id=${plan.publicId}, eid=${item.mealPlanRecipeId})}"
                                        class="btn btn-action btn-action--delete">
                                    Remove
                                </button>
                            </div>

                            <div class="inline-action-group meal-edit-val hide-cell">
                                <button type="submit"
                                        form="editScheduledEntryForm"
                                        th:formaction="@{/meal-plans/{id}/entries/{eid}/schedule(id=${plan.publicId}, eid=${item.mealPlanRecipeId})}"
                                        class="btn btn-action btn-action--primary">
                                    Save
                                </button>
                                <button type="button"
                                        class="btn btn-action btn-action--cancel js-cancel-meal-btn">
                                    Cancel
                                </button>
                            </div>
                        </td>
                    </tr>
                </th:block>
            </div>
        </form>
    </th:block>
</body>
</html>
