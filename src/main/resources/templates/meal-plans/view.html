<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz"
      layout:decorate="~{fragments/layout}"
      lang="en">

<head>
    <title th:text="${plan.planName}">Meal Plan</title>
    <th:block layout:fragment="page_styles">
        <link rel="stylesheet" th:href="@{/css/recipes/view.css}" />
        <link rel="stylesheet" th:href="@{/css/meal-plans/meal-plan.css}" />
    </th:block>
</head>

<body>
    <h1 layout:fragment="page-title" th:text="${plan.planName}">Meal Plan</h1>
    <p layout:fragment="page-subtitle"
       th:text="${plan.description != null && !plan.description.isBlank()} ? ${plan.description} : 'Schedule recipes from your cookbook and build your shopping list.'"></p>

    <div layout:fragment="action-tray" class="action-tray">
        <a th:href="@{/}"
            class="btn btn-secondary">
                ← Home
        </a>

        <button type="submit"
                form="scheduledMealsForm"
                class="btn btn-action btn-action--primary"
                th:disabled="${scheduledMeals.isEmpty()}">
            View Shopping List
        </button>
    </div>


    <main layout:fragment="content">
        <div th:if="${successMessage}" class="alert alert--success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert--danger" th:text="${errorMessage}"></div>

        <!-- ADD RECIPE TO DAY / DATE BAR -->
        <div th:if="${canEdit}" class="meal-plan-card-wide">
            <h3 class="profile-section-title">Add Recipe from Cookbook</h3>
            <form th:action="@{/meal-plans/{id}/recipes/add(id=${plan.publicId})}" method="post" class="inline-flex-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group flex-field-grow">
                    <label for="recipeId" class="form-label">Recipe</label>
                    <select id="recipeId" name="recipeId" class="form-input select2-enable" required>
                        <option value="">-- Choose a Recipe --</option>
                        <optgroup label="My Created Recipes" th:if="${!availableRecipes.isEmpty()}">
                            <option th:each="r : ${availableRecipes}" th:value="${r.recipeId}" th:text="${r.title}"></option>
                        </optgroup>
                        <optgroup label="Saved Cookbook Recipes" th:if="${!savedCookbookRecipes.isEmpty()}">
                            <option th:each="r : ${savedCookbookRecipes}" th:value="${r.recipeId}" th:text="${r.title}"></option>
                        </optgroup>
                    </select>
                </div>

                <!-- Recurring Plan: Select Day (Mon - Sun) -->
                <div th:if="${plan.isRecurring}" class="form-group flex-field-med">
                    <label for="dayOfWeek" class="form-label">Day</label>
                    <select id="dayOfWeek" name="dayOfWeek" class="form-input" required>
                        <option value="1">Monday</option>
                        <option value="2">Tuesday</option>
                        <option value="3">Wednesday</option>
                        <option value="4">Thursday</option>
                        <option value="5">Friday</option>
                        <option value="6">Saturday</option>
                        <option value="7">Sunday</option>
                    </select>
                </div>

                <!-- Calendar Plan: Select Date -->
                <div th:unless="${plan.isRecurring}" class="form-group flex-field-med">
                    <label for="scheduledDate" class="form-label">Date</label>
                    <input type="date" id="scheduledDate" name="scheduledDate" class="form-input" required />
                </div>

                <div class="form-group flex-field-med">
                    <label for="mealType" class="form-label">Meal</label>
                    <select id="mealType" name="mealType" class="form-input">
                        <option value="Dinner">Dinner</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Snack">Snack</option>
                    </select>
                </div>

                <div class="form-group flex-field-sm">
                    <label for="servingsOverride" class="form-label">Servings</label>
                    <input type="number" id="servingsOverride" name="servingsOverride" min="1" class="form-input" placeholder="Default" />
                </div>

                <button th:replace="~{fragments/actions :: submitBtn('Add to Plan')}"></button>
            </form>
        </div>

        <!-- TABS NAVIGATION (2 Clean Tabs) -->
        <div class="view-mode-tabs" role="tablist">
            <button type="button" class="tab-btn active" role="tab" aria-selected="true" data-target="schedule-panel">
                Scheduled Meals (<span th:text="${scheduledMeals.size()}">0</span>)
            </button>
            <button type="button" class="tab-btn" role="tab" aria-selected="false" data-target="share-panel">
                Sharing (<span th:text="${plan.shares.size()}">0</span>)
            </button>
        </div>

        <!-- MODULAR TAB PANELS -->
        <div id="schedule-panel" class="tab-panel active-panel">
            <div th:insert="~{meal-plans/plans/schedule :: schedule-panel}"></div>
        </div>

        <div id="share-panel" class="tab-panel hide-cell">
            <div th:insert="~{meal-plans/plans/share :: share-panel}"></div>
        </div>
    </main>

    <th:block layout:fragment="page_scripts">
        <script th:src="@{/js/meal-plans/meal-plan.js}"></script>
    </th:block>
</body>
</html>
