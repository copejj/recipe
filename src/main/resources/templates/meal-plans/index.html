<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz"
      layout:decorate="~{fragments/layout}"
      lang="en">

<head>
    <title>Meal Plans</title>
    <th:block layout:fragment="page_styles">
        <link rel="stylesheet" th:href="@{/css/meal-plans/meal-plan.css}" />
    </th:block>
</head>

<body>
    <h1 layout:fragment="page-title">Meal Plans</h1>
    <p layout:fragment="page-subtitle">Organize your weekly menus, share plans, and generate combined shopping lists.</p>
    <div layout:fragment="action-tray" class="action-tray">
        <a th:href="@{/(home=1)}" class="btn btn-secondary js-smart-back">← Home</a>
    </div>

    <main layout:fragment="content">
        <div th:if="${successMessage}" class="alert alert--success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert--danger" th:text="${errorMessage}"></div>

        <div class="meal-plan-card-wide">
            <h3 class="profile-section-title">Create a New Meal Plan</h3>
            <form th:action="@{/meal-plans/create}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group">
                    <label for="planName" class="form-label">Plan Name</label>
                    <input type="text" id="planName" name="planName" class="form-input" required
                           placeholder="e.g., Weeknight Dinners or Holiday Menu" />
                </div>

                <div class="form-group">
                    <label for="description" class="form-label">Notes / Description (Optional)</label>
                    <input type="text" id="description" name="description" class="form-input"
                           placeholder="Quick notes about this meal plan" />
                </div>

                <div class="inline-flex-form">
                    <label class="checkbox-label-row">
                        <input type="checkbox" name="isRecurring" value="true" />
                        <span>Recurring Weekly Plan (Monday–Sunday)</span>
                    </label>

                    <button th:replace="~{fragments/actions :: submitBtn('Create Meal Plan')}"></button>
                </div>
            </form>
        </div>

        <h2>Your Meal Plans</h2>
        <div th:if="${mealPlans == null || mealPlans.isEmpty()}" class="alert alert--info">
            You don't have any meal plans yet. Create one above to start planning!
        </div>

        <div class="status-grid" th:if="${mealPlans != null && !mealPlans.isEmpty()}">
            <div th:each="plan : ${mealPlans}" class="status-item clickable-card">
                <span class="status-icon" th:text="${plan.isRecurring} ? '🔁' : '📅'">📅</span>
                <div class="status-info">
                    <span class="status-value" th:text="${plan.planName}">Weekly Plan</span>
                    <small class="plan-card-meta"
                           th:text="'By ' + ${plan.user.displayName} + ' • ' + ${plan.plannedRecipes.size()} + ' recipes'">
                        By Chef • 0 recipes
                    </small>
                    <a th:href="@{/meal-plans/{id}(id=${plan.publicId})}" class="status-link stretched-link">
                        Open Planner →
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
