<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">

<head th:replace="~{fragments/layout :: html_head('Modify Access - Braindribbler')}"></head>

<body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main class="page-card auth-layout" style="max-width: 500px; margin-top: 40px;">
        <h1 class="page-title">Manage Permissions</h1>
        <p class="page-subtitle" th:text="'Modifying role clusters for: ' + ${targetUser.displayName}"></p>

        <form th:action="@{/admin/users/edit/{id}/roles(id=${targetUser.publicId})}" method="post">
            <div class="form-group" style="margin-bottom: 24px;">
                <label class="form-label" style="margin-bottom: 12px; font-size: 1rem;">Assignable Roles</label>

                <!-- Dynamic Checkbox Matrix Loop -->
                <div th:each="role : ${assignableRoles}"
                    style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">

                    <!-- SECURITY PROTECTION: Disable the checkbox if it is the baseline user role -->
                    <input type="checkbox" name="selectedRoles" th:value="${role.roleId}"
                        th:id="'role_' + ${role.roleId}"
                        th:checked="${targetUser.roles.contains(role) || role.roleName == 'ROLE_USER'}"
                        th:disabled="${role.roleName == 'ROLE_USER'}"
                        style="width: 18px; height: 18px; cursor: pointer;" />

                    <!-- Keep a hidden fallback input so the browser still transmits the ROLE_USER ID back to Java if disabled -->
                    <input type="hidden" th:if="${role.roleName == 'ROLE_USER'}" name="selectedRoles"
                        th:value="${role.roleId}" />

                    <label th:for="'role_' + ${role.roleId}" th:text="${role.roleName}"
                        style="font-weight: 500; cursor: pointer; color: var(--color-text-dark);">
                    </label>
                </div>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 30px;">
                <button type="submit" class="btn btn--primary">Save Privileges</button>
                <a th:href="@{/admin/users}" class="btn"
                    style="background-color: var(--color-border-input); color: var(--color-text-dark); text-decoration: none;">Cancel</a>
            </div>
        </form>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>

</html>
