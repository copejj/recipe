<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{fragments/layout :: html_head('Modify Permissions - Braindribbler')}"></head>

<body>

    <!-- Shared Header Fragment -->
    <div th:replace="~{fragments/layout :: header}"></div>

    <!-- Reuses your centralized page-card authorization structure -->
    <main class="page-card auth-layout">

        <h1 class="page-title" style="text-align: center;" th:text="'Edit ' + ${role.roleName}">Edit Role</h1>
        <p class="page-subtitle" style="text-align: center; margin-bottom: 25px;" th:text="${role.description}">Role
            description details</p>

        <!-- Form Handling connecting back to our matrix update controller -->
        <form th:action="@{/admin/roles/edit/{id}(id=${role.roleId})}" method="post">

            <div class="form-group form-group--last">
                <label class="form-label" style="margin-bottom: 12px; display: block; font-weight: bold;">Toggle Active
                    Authorities</label>

                <!-- Layout container for permission boxes -->
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div th:each="perm : ${allPermissions}"
                        style="display: flex; align-items: flex-start; gap: 10px; padding: 12px; border: 1px solid var(--border-color, #ddd); border-radius: 6px;">

                        <input type="checkbox" name="permissionIds" th:value="${perm.permissionId}"
                            th:id="'perm-' + ${perm.permissionId}" th:checked="${role.permissions.contains(perm)}"
                            style="margin-top: 4px; cursor: pointer;" />

                        <div style="display: flex; flex-direction: column; line-height: 1.3;">
                            <label th:for="'perm-' + ${perm.permissionId}" style="font-weight: bold; cursor: pointer;"
                                th:text="${perm.permissionName}">can_manage_users</label>
                            <small style="color: #666; font-size: 0.85rem; margin-top: 2px;"
                                th:text="${perm.description}">Grants access to administration parameters.</small>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Execution Processing Control matched to your primary button component -->
            <button type="submit" class="btn btn--primary" style="margin-top: 15px;">Update Security Matrix</button>

        </form>

        <p class="auth-footer-text" style="text-align: center; margin-top: 25px;">
            Changed your mind? <a th:href="@{/admin/roles}" class="auth-link">Return to overview</a>
        </p>

    </main>

    <!-- Shared Footer Fragment -->
    <div th:replace="~{fragments/layout :: footer}"></div>

</body>

</html>
