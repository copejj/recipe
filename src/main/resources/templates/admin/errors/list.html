<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz"
      layout:decorate="~{fragments/layout}"
      lang="en">
<head>
    <title>System Error Logs</title>
    <th:block layout:fragment="page_styles">
        <link rel="stylesheet" th:href="@{/css/recipes/view.css}" />
        <link rel="stylesheet" th:href="@{/css/feedback.css}" />
    </th:block>
</head>

<body>
    <div layout:fragment="page-title">System Error Logs</div>
    <p layout:fragment="page-subtitle">Most recent 200 captured HTTP 4xx/5xx events.</p>

    <div layout:fragment="action-tray" class="action-tray sticky-stack-item">
        <a th:href="@{/admin}" class="btn btn-secondary">← Admin Dashboard</a>
        <a th:href="@{/admin/feedback}" class="btn btn-action btn-action--secondary">User Feedback Reports</a>

        <form th:action="@{/admin/errors/purge-unlinked}" method="post" class="inline-form-reset">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit"
                    class="btn btn-action btn-action--delete"
                    data-confirm="Purge all error logs that are not attached to a user feedback report?">
                Purge Unlinked Logs
            </button>
        </form>
    </div>

    <main layout:fragment="content">
        <div th:if="${successMessage}" class="alert alert--success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert--danger" th:text="${errorMessage}"></div>

        <div class="admin-table-wrapper">
            <div th:replace="~{fragments/datatable :: genericTableWithOrder(
                tableId='errorLogsTable',
                dataList=${errorLogs},
                headerTemplate=~{::errHeaders},
                rowTemplate=~{::errRow},
                defaultOrder='[[5, &quot;desc&quot;]]'
            )}">
                <th:block th:fragment="errHeaders">
                    <tr>
                        <th>Action</th>
                        <th>Ref ID</th>
                        <th>Status</th>
                        <th>Request URI</th>
                        <th>User</th>
                        <th>Occurred On</th>
                    </tr>
                </th:block>

                <th:block th:fragment="errRow">
                    <tr>
                        <td data-label="Action">
                            <a th:replace="~{fragments/actions :: editLink(targetUrl=@{/admin/errors/edit/{id}(id=${item.errorLogId})})}"></a>
                        </td>
                        <td data-label="Ref ID">
                            <strong th:text="${item.referenceCode}">ERR-000000</strong>
                        </td>
                        <td data-label="Status">
                            <span class="feedback-type-pill"
                                  th:classappend="${item.statusCode >= 500} ? 'feedback-type-pill--bug' : 'feedback-status-pill--open'"
                                  th:text="${item.statusCode}">500</span>
                        </td>
                        <td data-label="Request URI"
                            th:text="${#strings.abbreviate((item.httpMethod ?: 'GET') + ' ' + (item.requestUri ?: '/'), 70)}">
                            GET /
                        </td>
                        <td data-label="User"
                            th:text="${item.user != null ? item.user.displayName : 'Guest'}">
                            Guest
                        </td>
                        <td data-label="Occurred On" th:data-order="${item.createdAt.toInstant().toEpochMilli()}">
                            <span th:text="${#temporals.format(item.createdAt, 'MM/dd/yyyy')}">11/27/2026</span>
                        </td>
                    </tr>
                </th:block>
            </div>
        </div>
    </main>
</body>
</html>
