<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">

<head th:replace="~{fragments/layout :: html_head('User Management')}"></head>

<body>

    <!-- Shared Navigation Header Fragment -->
    <div th:replace="~{fragments/layout :: header}"></div>

    <main class="page-card">
        <h1 class="page-title">Chef Registry</h1>
        <p class="page-subtitle">Manage system user access privileges, administrative account bans, and profile states.
        </p>

        <!-- Administrative Management Data Table Grid -->
        <div class="admin-table-wrapper">

            <div th:replace="~{fragments/datatable :: genericTable(
                tableId='chefRegistryTable',
                dataList=${chefs},
                headerTemplate=~{::chefHeaders},
                rowTemplate=~{::chefRow}
            )}">

                <!-- Define Header Structure -->
                <th:block th:fragment="chefHeaders">
                    <tr>
                        <th>Action</th>
                        <th>Display</th>
                        <th>Email</th>
                        <th>Created At</th>
                        <th>Verification Status</th>
                        <th>Account Status</th>
                    </tr>
                </th:block>

                <!-- Define Row Structure -->
                <th:block th:fragment="chefRow">
                    <tr>
                        <td data-label="Action">
                            <th:block th:if="${item.highestRoleRankValue < loggedInAdminRank}">
                                <a
                                    th:replace="~{fragments/actions :: editLink(targetUrl=@{/admin/users/edit/{id}(id=${item.publicId})})}"></a>
                            </th:block>

                            <th:block th:if="${item.highestRoleRankValue >= loggedInAdminRank}">
                                <span th:replace="~{fragments/actions :: lockedBadge}"></span>
                            </th:block>
                        </td>
                        <td data-label="Display" class="role-name-cell" th:text="${item.displayName}">SousChefJane
                        </td>
                        <td data-label="Email" th:text="${item.userAuth != null ? item.userAuth.email : 'N/A'}">
                            chef@braindribbler.com</td>
                        <td data-label="Created At" th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm')}">
                            2026-10-08</td>
                        <td data-label="Verification Status">
                            <span th:if="${item.userAuth != null && item.userAuth.verified}"
                                class="status-text--verified">Verified</span>
                            <span th:if="${item.userAuth == null || !item.userAuth.verified}"
                                class="status-text--pending">Pending Link</span>
                        </td>
                        <td data-label="Account Status">
                            <span th:if="${item.disabledAt == null}" class="status-text--active">Active</span>
                            <span th:if="${item.disabledAt != null}" class="status-text--banned">Inactive</span>
                        </td>
                    </tr>
                </th:block>

            </div>

        </div>
    </main>

</body>

</html>
