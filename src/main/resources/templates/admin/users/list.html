<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz"
      layout:decorate="~{fragments/layout}"
      lang="en">
<head>
    <title>User Management</title>
    <th:block layout:fragment="page_styles">
        <link rel="stylesheet" th:href="@{/css/recipes/view.css}" />
    </th:block>
</head>

<body>
    <div layout:fragment="page-title"> Chef Registry </div>
    <p layout:fragment="page-subtitle"> Manage system user access privileges, administrative account bans, and profile states. </p>
    <main layout:fragment="content">
        <div class="admin-table-wrapper">

            <div th:replace="~{fragments/datatable :: genericTable(
                tableId='userTable',
                dataList=${chefs},
                headerTemplate=~{::chefHeaders},
                rowTemplate=~{::chefRow}
            )}">

                <!-- Define Header Structure -->
                <th:block th:fragment="chefHeaders">
                    <tr>
                        <th>Action</th>
                        <th>Display</th>
                        <th>Email</th>
                        <th>Last Login</th>
                        <th>Verification Status</th>
                        <th>Account Status</th>
                    </tr>
                </th:block>

                <!-- Define Row Structure -->
                <th:block th:fragment="chefRow">
                    <tr>
                        <td data-label="Action">
                            <th:block th:if="${item.highestRoleRankValue < loggedInAdminRank}">
                                <a th:replace="~{fragments/actions :: editLink(targetUrl=@{/admin/users/edit/{id}(id=${item.publicId})})}"></a>
                            </th:block>

                            <th:block th:if="${item.highestRoleRankValue >= loggedInAdminRank}">
                                <span th:replace="~{fragments/actions :: lockedBadge}"></span>
                            </th:block>
                        </td>
                        <td data-label="Display" class="role-name-cell" th:text="${item.displayName}">SousChefJane </td>
                        <td data-label="Email" th:text="${item.userAuth != null ? item.userAuth.email : 'N/A'}">chef@braindribbler.com</td>
                        <td data-label="Last Login" th:data-order="${item.userAuth?.lastLogin}">
                            <span data-label="lastLogin" 
                                class="local-time" 
                                th:datetime="${item.userAuth?.lastLogin}" 
                                th:text="${item.userAuth?.lastLogin}"> 
                                2026-10-08 15:30
                            </span>
                        </td>
                        <td data-label="Verification Status">
                            <span th:if="${item.userAuth != null && item.userAuth.verified}"
                                class="status-text--verified">Verified</span>
                            <span th:if="${item.userAuth == null || !item.userAuth.verified}"
                                class="status-text--pending">Pending Link</span>
                        </td>
                        <td data-label="Account Status">
                            <span th:if="${item.disabledAt == null}" class="status-text--active">Active</span>
                            <span th:if="${item.disabledAt != null}" class="status-text--banned">Inactive</span>
                        </td>
                    </tr>
                </th:block>
            </div>
        </div>
    </main>
    <th:block layout:fragment="page_scripts">
        <script th:src="@{/js/admin/user-list.js}"></script>
    </th:block> 
</body>
</html>
