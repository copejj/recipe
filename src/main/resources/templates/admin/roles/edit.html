<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" xmlns:sec="http://thymeleaf.org" lang="en">

<head>
    <th:block th:replace="~{fragments/layout :: html_head('Modify Role Tiers - Braindribbler')}"></th:block>
    <link rel="stylesheet" type="text/css" th:href="@{/css/admin/roles-edit.css}" />
</head>

<body>

    <div th:replace="~{fragments/layout :: header}"></div>

    <main class="page-card">
        <h1 class="page-title"
            th:text="${role.roleId == null} ? 'Create Global Security Role' : 'Modify Security Role Tier'">
            Edit Role
        </h1>
        <p class="page-subtitle">
            Assign functional authority parameters and adjust platform access access tokens for this application user
            tier.
        </p>

        <form th:action="@{/admin/roles/edit/{id}(id=${role.roleId})}" th:object="${role}" method="POST"
            class="role-edit-form">
            <input type="hidden" th:field="*{roleId}" />

            <!-- Core Text Inputs -->
            <div class="form-group">
                <label class="form-label">Role System Identifier</label>
                <input type="text" class="form-input" th:field="*{roleName}" required
                    placeholder="e.g. ROLE_MODERATOR" />
            </div>

            <div class="form-group--last">
                <label class="form-label">Role Purpose / Description</label>
                <input type="text" class="form-input" th:field="*{description}"
                    placeholder="e.g. Can manage recipe categories and reviews" />
            </div>

            <!-- Permission Selection Framework Console -->
            <div class="permissions-management-section">
                <h3>Assigned Operational Permissions</h3>
                <p class="section-helper-text">Select individual functional boundaries explicitly granted to this system
                    security profile:</p>

                <div class="permissions-grid-pipeline">
                    <!-- Iterates over available database authority items -->
                    <div th:each="perm : ${allPermissions}" class="permission-item-row">
                        <div class="permission-checkbox-cell">
                            <input type="checkbox" name="permissionIds" th:value="${perm.permissionId}"
                                th:id="'perm-' + ${perm.permissionId}"
                                th:checked="${role.permissions.contains(perm)}" />
                        </div>

                        <div class="permission-checkbox-details">
                            <label th:for="'perm-' + ${perm.permissionId}"
                                th:text="${perm.permissionName}">can_manage_users</label>
                            <small th:text="${perm.description}">Grants access to administration parameters.</small>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Unified Left-Aligned Action Control Buttons Pipeline -->
            <div class="form-actions-left-row">
                <th:block th:replace="~{fragments/actions :: saveBtn(itemId=${role.roleId})}"></th:block>
                <th:block th:replace="~{fragments/actions :: cancelLink(targetUrl=@{/admin/roles})}"></th:block>
            </div>

        </form>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

</body>

</html>
