<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz"
      layout:decorate="~{fragments/layout}"
      lang="en">
<head>
    <title>Role Matrix</title>
    <th:block layout:fragment="page_styles">
        <link rel="stylesheet" type="text/css" th:href="@{/css/admin/roles-list.css}" />
    </th:block>
</head>

<body>
    <h1 layout:fragment="page-title">Role & Authority Matrix</h1>
    <p layout:fragment="page-subtitle">Manage global security tiers and permissions</p>
    
    <main layout:fragment="content">
        <!-- Universal Admin Section Layout Controls -->
        <div class="admin-header-flex">
            <!-- Standardized clean button styling blueprint integration -->
            <div class="admin-btn-group">
                <button type="button" class="btn btn-action btn-action--primary btn-action--header-cta"
                    onclick="openModal('roleModal')">+ Add New Role</button>
            </div>
        </div>

        <div class="admin-table-wrapper">

            <!-- CENTRALIZED DATATABLE COMPONENT INJECTION -->
            <div th:replace="~{fragments/datatable :: genericTable(
                tableId='roleMatrixTable', 
                dataList=${roles}, 
                headerTemplate=~{::matrixHeaders}, 
                rowTemplate=~{::matrixRows}
            )}">

                <!-- Table Headers Slot -->
                <th:block th:fragment="matrixHeaders">
                    <tr>
                        <th class="matrix-col-actions">Actions</th>
                        <th>Role Name</th>
                        <th>Description</th>
                        <th>Assigned Permissions</th>
                    </tr>
                </th:block>

                <!-- Table Rows Slot Blueprint Block -->
                <th:block th:fragment="matrixRows">
                    <tr>
                        <!-- data-label markers mapping your desktop header text exactly -->
                        <td class="matrix-actions-cell" data-label="Actions">
                            <div class="admin-btn-group">
                                <th:block
                                    th:replace="~{fragments/actions :: editLink(targetUrl=@{/admin/roles/edit/{id}(id=${item.roleId})})}">
                                </th:block>
                            </div>
                        </td>
                        <td th:data-order="${item.roleRank}" class="role-name-cell" data-label="Role Name" th:text="${item.roleName}">ROLE_ADMIN</td>
                        <td data-label="Description" th:text="${item.description}">Administrative access</td>
                        <td data-label="Permissions">
                            <div class="badge-container">
                                <span th:each="perm : ${item.permissions}" class="badge-permission"
                                    th:text="${perm.permissionName}">can_manage_users</span>
                                <span th:if="${item.permissions.empty}" class="badge-permission--none">No
                                    permissions</span>
                            </div>
                        </td>
                    </tr>
                </th:block>
            </div>

        </div>

        <!-- Cleansed Footer Controls (FIXED: Zero inline style attributes remaining) -->
        <div class="form-actions-footer">
            <div class="modal-actions-footer">
                <a th:replace="~{fragments/actions :: cancelLink(targetUrl=@{/admin/users})}"></a>
            </div>
        </div>

        <div th:replace="~{fragments/modals :: create_role_modal}"></div>
    </main>
    <th:block layout:fragment="page_scripts">
        <script type="text/javascript" th:src="@{/js/admin/roles-list.js}"></script>
    </th:block> 
</body>
</html>
