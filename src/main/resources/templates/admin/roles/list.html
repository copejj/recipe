<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">

<!-- Explicitly routing layout dependencies via your global component baseline configuration -->

<head th:replace="~{fragments/layout :: html_head('Role Matrix - Braindribbler')}"></head>

<body>

    <!-- Shared Navigation Header Fragment -->
    <div th:replace="~{fragments/layout :: header}"></div>

    <main class="page-card">

        <!-- Universal Admin Section Layout Controls -->
        <div class="admin-header-flex">
            <div>
                <h1 class="page-title">Role & Authority Matrix</h1>
                <p class="page-subtitle">Manage global security tiers and permissions</p>
            </div>
            <!-- Standardized clean button styling blueprint integration -->
            <div class="admin-btn-group">
                <button type="button" class="btn btn-action btn-action--primary btn-action--header-cta"
                    onclick="openModal('roleModal')">+ Add New Role</button>
            </div>
        </div>

        <div class="admin-table-wrapper">

            <!-- CENTRALIZED DATATABLE COMPONENT INJECTION -->
            <div th:replace="~{fragments/datatable :: genericTable(
                tableId='roleMatrixTable', 
                dataList=${roles}, 
                headerTemplate=~{::matrixHeaders}, 
                rowTemplate=~{::matrixRows}
            )}">

                <!-- Table Headers Slot (FIXED: Action shifted to the far left) -->
                <th:block th:fragment="matrixHeaders">
                    <tr>
                        <th class="matrix-col-actions">Actions</th>
                        <th>Role Name</th>
                        <th>Description</th>
                        <th>Assigned Permissions</th>
                    </tr>
                </th:block>

                <!-- Table Rows Slot -->
                <th:block th:fragment="matrixRows">
                    <tr>
                        <td class="matrix-actions-cell">
                            <div class="admin-btn-group">
                                <!-- Reusable Edit Action Component Call replacing loose 'Modify Options' link -->
                                <a
                                    th:replace="~{fragments/actions :: editLink(targetUrl=@{/admin/roles/edit/{id}(id=${item.roleId})})}"></a>
                            </div>
                        </td>
                        <td class="role-name-cell" th:text="${item.roleName}">ROLE_ADMIN</td>
                        <td th:text="${item.description}">Administrative access</td>
                        <td>
                            <div class="badge-container">
                                <span th:each="perm : ${item.permissions}" class="badge-permission"
                                    th:text="${perm.permissionName}">can_manage_users</span>
                                <span th:if="${item.permissions.empty}" class="badge-permission--none">No
                                    permissions</span>
                            </div>
                        </td>
                    </tr>
                </th:block>

            </div>

        </div>

        <!-- Cleansed Footer Controls (FIXED: Zero inline style attributes remaining) -->
        <div class="form-actions-footer">
            <div class="modal-actions-footer">
                <a th:replace="~{fragments/actions :: cancelLink(targetUrl=@{/admin/users})}"></a>
            </div>
        </div>

        <div th:replace="~{fragments/modals :: create_role_modal}"></div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <script>
        // Native browser overlay engine controls
        function openModal(id) { document.getElementById(id).showModal(); }
        function closeModal(id) { document.getElementById(id).close(); }
    </script>
</body>

</html>
