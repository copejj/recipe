<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz"
      layout:decorate="~{fragments/layout}"
      lang="en">
<head>
    <title th:text="${ingredient.ingredientId != null} ? 'Edit Ingredient' : 'Add New Ingredient'"></title> 
    <th:block layout:fragment="page_styles">
        <link rel="stylesheet" th:href="@{/css/admin/ingredients-edit.css}" />
    </th:block>
</head>

<body>
    <h1 layout:fragment="page-title" 
        th:text="${ingredient.ingredientId != null} ? 'Modify Ingredient Profile' : 'Add Master Ingredient'">
            Add Master Ingredient</h1>
    <p layout:fragment="page-subtitle"
        th:text="${ingredient.ingredientId != null} ? 'Update global lookup properties or fix lingering typos for this ingredient.' : 'Manually inject a pre-verified food definition straight into the global lookup pool.'">
            Dynamic subtext baseline describing the primary interface role or system domain.</p>
    <main layout:fragment="content" class="form-card">
        <form
            th:action="${ingredient.ingredientId != null} ? @{/admin/metadata/ingredients/edit/{id}(id=${ingredient.ingredientId})} : @{/admin/metadata/ingredients/add}"
            method="post" class="ingredient-entry-form">

            <!-- FIELD 1: INGREDIENT MASTER NAME -->
            <div class="form-field-group">
                <label for="ingredientName">Ingredient Master Name</label>
                <input type="text" id="ingredientName" name="ingredientName" th:value="${ingredient.ingredientName}"
                    class="form-input" required />
            </div>

            <!-- FIELD 2: SCALING TRACK CLASSIFICATION DROPDOWN -->
            <div class="form-field-group field-group--extended">
                <label for="classification">Scaling Track Classification</label>
                <select id="classification" name="classification" class="form-input" required>
                    <!-- Loops dynamically over the classifications exposed globally via the controller -->
                    <option th:each="enumType : ${classifications}" th:value="${enumType.name()}"
                        th:text="${enumType.name() + ' — (' + enumType.description + ')'}"
                        th:selected="${ingredient.classification != null and enumType.name() == ingredient.classification.name()}">
                    </option>
                </select>
            </div>

            <!-- FIELD 3: GROCERY SECTION CATEGORY -->
            <div class="form-field-group">
                <label for="groceryCategoryId">Grocery Section Category</label>
                <select id="groceryCategoryId" name="groceryCategoryId" class="form-input" required>
                    <option value="">-- Select Category Section --</option>
                    <option th:each="cat : ${groceryCategories}" th:value="${cat.groceryCategoryId}"
                        th:text="${cat.categoryName}"
                        th:selected="${ingredient.groceryCategory != null and cat.groceryCategoryId == ingredient.groceryCategory.groceryCategoryId}">
                    </option>
                </select>
            </div>

            <!-- ACTIONS FOOTER BUTTON GRID -->
            <div class="form-actions-tray">
                <!-- Swaps in your primary save action button, passing the ID tracking check -->
                <button
                    th:replace="~{fragments/actions :: saveBtn(itemId=${ingredient.ingredientId != null ? ingredient.ingredientId : 0})}">Save</button>

                <!-- Swaps in your neutral cancel link redirection action button -->
                <a th:replace="~{fragments/actions :: cancelLink(targetUrl=@{/admin/metadata/ingredients/list})}">Cancel</a>
            </div>

        </form>
    </main>
</body>
</html>
