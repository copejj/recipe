<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz"
      layout:decorate="~{fragments/layout}"
      lang="en">

<head>
    <title>Blacklist Registry</title>
</head>

<body>
    <div layout:fragment="page-title">Blacklist Registry</div>
    <p layout:fragment="page-subtitle"> Manage global server firewall 
        security exceptions, block compromised router IP blocks, and 
        intercept automated registration spam networks.
    </p>
    <main layout:fragment="content">
        <div>
            <th:block th:fragment="cookbookButtons">
                <a th:target="_self" th:href="@{/admin/blacklist/add}"
                    class="btn btn--primary add-primary-button">
                    + Add New Entry
                </a>
            </th:block>
        </div>

        <!-- Administrative Management Data Table Grid -->
        <div class="admin-table-wrapper">

            <!-- CENTRALIZED DATATABLE COMPONENT INJECTION -->
            <div th:replace="~{fragments/datatable :: genericTable(
                tableId='blacklistRegistryTable', 
                dataList=${blacklist}, 
                headerTemplate=~{::blacklistHeaders}, 
                rowTemplate=~{::blacklistRows}
            )}">

                <!-- Table Headers Structural Slot -->
                <th:block th:fragment="blacklistHeaders">
                    <tr>
                        <th class="blacklist-col-actions">Action</th>
                        <th>Pattern</th>
                        <th>Type</th>
                        <th class="blacklist-col-reason">Reason</th>
                    </tr>
                </th:block>

                <!-- Table Rows Data Slot -->
                <th:block th:fragment="blacklistRows">
                    <tr>
                        <td data-label="Action" class="blacklist-actions-cell">
                            <div class="admin-btn-group">

                                <!-- Centralized Reusable Edit Button Fragment Call -->
                                <a
                                    th:replace="~{fragments/actions :: editLink(targetUrl=@{/admin/blacklist/edit/{id}(id=${item.id})})}"></a>

                                <!-- Native Local Form Wrapper targeting the plain button fragment -->
                                <form th:action="@{/admin/blacklist/delete/{id}(id=${item.id})}" method="POST"
                                    class="btn-action-form"
                                    onsubmit="return confirm('Are you sure you want to remove this restriction rule?');">

                                    <!-- Injects just the stylized button element natively with zero compilation risks -->
                                    <button th:replace="~{fragments/actions :: deleteBtn}"></button>

                                </form>

                            </div>
                        </td>
                        <td data-label="Pattern"><strong th:text="${item.pattern}">198.12.69.94</strong></td>
                        <td data-label="Type">
                            <!-- Clean inline context badge modifier rules -->
                            <span th:text="${item.type}"
                                th:class="'blacklist-badge blacklist-badge-' + ${#strings.toLowerCase(item.type)}">IP</span>
                        </td>
                        <td data-label="Reason" class="blacklist-col-reason"
                            th:text="${item.reason != null && !item.reason.blank} ? ${item.reason} : 'No details provided'">
                            Reason notes
                        </td>
                    </tr>
                </th:block>

            </div>

        </div>
    </main>
</body>
</html>
