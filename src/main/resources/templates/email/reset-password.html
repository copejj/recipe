<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <h2>Reset Your Password</h2>
    <p>Hi <span th:text="${firstName}">Chef</span>,</p>
    <p>We received a request to reset your Brain Dribbler Recipes password. Click the button below to choose a new one:</p>
    <p style="margin: 24px 0;">
        <a th:href="${actionUrl}"
           style="display: inline-block; padding: 12px 24px; background-color: #2f855a; color: #ffffff; text-decoration: none; border-radius: 5px; font-weight: bold;">
            Reset Password
        </a>
    </p>
    <p style="font-size: 13px; color: #666;">
        This link will expire in 2 hours. If you didn't request a password reset, you can safely ignore this email.
    </p>
    <p>Happy Cooking!</p>
</body>
</html>
