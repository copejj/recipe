<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">

<head th:replace="~{fragments/layout :: html_head('Home - Braindribbler')}"></head>

<body>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main>
        <div class="page-card">
            <h1 class="page-title">Welcome to the Recipe Portal</h1>
            <p th:text="${message}" class="page-subtitle">Placeholder context.</p>

            <div class="hero-search-section">
                <p class="search-prompt">Looking for a specific dish? Use our central database filter:</p>
                <form th:action="@{/search}" method="get" class="hero-search-form">
                    <input type="text" name="query" class="form-input hero-search-input"
                        placeholder="Search recipes, ingredients, or chefs..." required />
                    <button type="submit" class="btn btn--primary hero-search-btn">Find Recipes</button>
                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>

</html>
