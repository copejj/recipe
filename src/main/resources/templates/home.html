<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">

<head th:replace="~{fragments/layout :: html_head('Dashboard - Braindribbler')}"></head>

<body>
    <div th:replace="~{fragments/layout :: header}"></div>
    <main class="content">
        <div
            style="background: #fff; padding: 30px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <h2 style="color: #28a745; margin-top: 0;">Session Fully Authenticated!</h2>

            <p th:text="${message}">Placeholder welcome text.</p>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;" />

            <p>Your security infrastructure is fully operational:</p>
            <ul>
                <li><strong>Password Engine:</strong> Adaptive Argon2id Verification</li>
                <li><strong>Identity Storage:</strong> PostgreSQL Database Persistence</li>
                <li><strong>Layout Engine:</strong> Hierarchical Thymeleaf Fragments</li>
            </ul>

            <div style="margin-top: 30px; display: flex; gap: 15px; align-items: center;">
                <a th:href="@{~/recipes/search}" class="btn">Go to Recipe Search</a>

                <!-- Secure Logout Mechanism -->
                <form th:action="@{~/logout}" method="post" style="margin: 0;">
                    <button type="submit"
                        style="background: none; border: none; color: #dc3545; text-decoration: underline; cursor: pointer; font-size: 1em;">
                        Sign Out Safely
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- Shared Footer Fragment -->
    <div th:replace="~{fragments/layout :: footer}"></div>

</body>

</html>
