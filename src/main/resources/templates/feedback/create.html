<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz"
      layout:decorate="~{fragments/layout}"
      lang="en">

<head>
    <title>Suggestion Box &amp; Bug Report</title>
    <th:block layout:fragment="page_styles">
        <link rel="stylesheet" th:href="@{/css/feedback.css}" />
    </th:block>
</head>

<body>
    <div layout:fragment="page-title">Kitchen Suggestion Box &amp; Bug Report</div>
    <p layout:fragment="page-subtitle">Share a feature idea or let us know if something isn't working right.</p>

    <div layout:fragment="action-tray" class="action-tray sticky-stack-item">
        <a th:href="@{/}" class="btn btn-secondary">← Home</a>
    </div>

    <main layout:fragment="content">
        <form th:action="@{/feedback/submit}" method="post" class="feedback-create-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="pageUrl" th:value="${fromUrl}" />

            <div class="form-group">
                <label for="feedbackTypeSelect" class="form-label">What would you like to send?</label>
                <select id="feedbackTypeSelect" name="feedbackType" class="form-input">
                    <option value="SUGGESTION" th:selected="${defaultType == 'SUGGESTION'}">💡 Feature Idea / Suggestion</option>
                    <option value="BUG" th:selected="${defaultType == 'BUG'}">🐛 Bug Report / Something Broken</option>
                </select>
            </div>

            <div class="form-group">
                <label for="feedbackSubjectInput" class="form-label">Short Summary</label>
                <input type="text" id="feedbackSubjectInput" name="subject" maxlength="200" required
                       class="form-input" placeholder="e.g., Add print view for shopping lists" />
            </div>

            <div class="form-group">
                <label for="feedbackDescriptionInput" class="form-label">Details</label>
                <textarea id="feedbackDescriptionInput" name="description" rows="5" maxlength="4000" required
                          class="form-input"
                          placeholder="Tell us what you'd love to see or steps to reproduce the issue..."></textarea>
            </div>

            <div class="form-actions-group">
                <button th:replace="~{fragments/actions :: submitBtn(label='Send Feedback')}"></button>
                <a th:replace="~{fragments/actions :: cancelLink(targetUrl=@{/})}"></a>
            </div>
        </form>
    </main>
</body>
</html>
