spring.application.name=Braindribbling Recipes
spring.thymeleaf.cache=false

app.log.level=INFO
app.secrets.base-name=recipe-secrets
spring.config.import=optional:classpath:secrets.properties,optional:file:/var/www/${app.secrets.base-name}.properties

server.servlet.session.cookie.name=RECIPE_JSESSIONID
server.servlet.session.cookie.path=/
server.servlet.session.persistent=true

spring.jpa.hibernate.ddl-auto=validate
spring.main.lazy-initialization=false

spring.jpa.show-sql=false

# Ensures all git properties (branch, tag, commit) are available to your code
spring.info.git.mode=full
# Map the Maven build parameters straight into Spring properties
git.branch=@git.branch@
git.commit.id.abbrev=@git.commit.id.abbrev@

logging.level.org.hibernate.SQL=OFF

server.address=127.0.0.1
server.port=8080
