spring.application.name=Braindribbling Recipes
spring.thymeleaf.cache=false

spring.config.import=optional:classpath:secrets.properties,optional:file:/var/www/recipe-secrets.properties

# Framework Log Noise Reduction Filters
logging.level.org.springframework.web.servlet.resource.ResourceHttpRequestHandler=ERROR
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR

# Session Persistence Configurations for Clean DevTools Restarts
server.servlet.session.persistent=false

# Explicit JPA View Rendering Thread Lifecycle Mappings
spring.jpa.open-in-view=true

server.servlet.session.cookie.name=RECIPE_JSESSIONID
server.servlet.session.cookie.path=/

spring.jpa.hibernate.ddl-auto=validate
spring.main.lazy-initialization=false

spring.jpa.show-sql=false

logging.level.org.hibernate.SQL=OFF

server.address=127.0.0.1
server.port=8080
