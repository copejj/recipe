spring.application.name=Braindribbling Recipes
spring.thymeleaf.cache=false

spring.config.import=optional:classpath:secrets.properties,optional:file:/var/www/recipe-secrets.properties

server.servlet.session.cookie.name=RECIPE_JSESSIONID
server.servlet.session.cookie.path=/
server.servlet.session.persistent=true

spring.jpa.hibernate.ddl-auto=validate
spring.main.lazy-initialization=false

spring.jpa.show-sql=false

logging.level.org.hibernate.SQL=OFF

server.address=127.0.0.1
server.port=8080
