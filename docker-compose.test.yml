services:
  # Mock Production Database
  test-db:
    image: postgres:15-alpine
    container_name: pipeline_test_db
    environment:
      POSTGRES_DB: local_prod_db
      POSTGRES_USER: test_migration_user
      POSTGRES_PASSWORD: test_secure_password
    ports:
      - "5433:5432"
    networks:
      - pipeline_net

  # Mock Production Linux Application Server
  test-server:
    image: ubuntu:22.04
    container_name: pipeline_test_server
    volumes:
      - .:/app
    networks:
      - pipeline_net
    command: tail -f /dev/null
    depends_on:
      - test-db

networks:
  pipeline_net:
    driver: bridge
