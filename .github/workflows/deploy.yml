name: Production Deployment

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_tag:
        description: 'Tag to use for testing (e.g. v1.0.0-test)'
        required: false
        default: 'testing'

jobs:
  deploy-to-production:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deployment
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_HOST: ${{ secrets.DB_HOST }}
          TAG_NAME: ${{ github.event.inputs.test_tag || github.event.release.tag_name }}
        with:
          host: ${{ vars.PROD_HOST }}
          port: ${{ secrets.SSH_PRIVATE_PORT }}
          username: ${{ secrets.SSH_PRIVATE_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_NAME,DB_USER,DB_PASS,DB_HOST,TAG_NAME
          script: |
            CURRENT_STEP="INITIALIZATION"
            echo "[Step 1/7] --- Starting Deployment for $TAG_NAME ---"
            
            GIT_BIN="/usr/bin/git"
            MVN_BIN="/usr/bin/mvn"
            FIND_BIN="/usr/bin/find"
            
            cd ${{ vars.PROD_APP_PATH }}
            export PGPASSWORD="$DB_PASS"
            PSQL_ARGS="-h $DB_HOST -U $DB_USER -d $DB_NAME -t --set ON_ERROR_STOP=1"
            DUMP_ARGS="-h $DB_HOST -U $DB_USER -d $DB_NAME --no-subscriptions --no-publications -x -O"

            # --- SAFEGUARDS: GLOBAL ERROR TRAP ---
            cleanup_on_failure() {
              EXIT_CODE=$?
              if [ $EXIT_CODE -ne 0 ]; then
                echo "!!! ERROR DETECTED in Step: $CURRENT_STEP (Exit Code: $EXIT_CODE) !!!"
                if [ "$CURRENT_STEP" == "DATABASE_MIGRATION" ]; then
                  echo "Cleaning up staging shadow schema due to failure..."
                  psql $PSQL_ARGS -c "DROP SCHEMA IF EXISTS public_shadow CASCADE;"
                fi
                $GIT_BIN checkout .
                exit $EXIT_CODE
              fi
            }
            trap cleanup_on_failure ERR

            CURRENT_STEP="DATABASE_BACKUP"
            echo "[Step 2/7] Cleaning up older historical backups & preparing isolated shadow schema..."
            psql $PSQL_ARGS -c "DROP SCHEMA IF EXISTS public_old CASCADE; DROP SCHEMA IF EXISTS public_shadow CASCADE;"
            
            # Clone production schema structures cleanly into shadow using Postgres native namespaces
            pg_dump $DUMP_ARGS -n public -f /tmp/live_full_snapshot.sql
            psql $PSQL_ARGS -c "CREATE SCHEMA public_shadow AUTHORIZATION $DB_USER;"
            psql $PSQL_ARGS --set search_path=public_shadow -f /tmp/live_full_snapshot.sql
            rm -f /tmp/live_full_snapshot.sql

            CURRENT_STEP="SOURCE_CHECKOUT"
            echo "[Step 3/7] Fetching code for tag: $TAG_NAME"
            $GIT_BIN fetch --tags --all
            $GIT_BIN checkout -B "release-$TAG_NAME" "$TAG_NAME"

            CURRENT_STEP="DATABASE_MIGRATION"
            echo "[Step 4/7] Compiling and running migrations against shadow schema..."
            
            # --- NEW VALIDATION: Scan for invalid migration filenames to alert developers ---
            if [ -d sql/migrations ]; then
              for FILE in sql/migrations/*; do
                [ -e "$FILE" ] || break
                FILENAME=$(basename "$FILE")
                # If the file does NOT match the required YYYYMMDD_NN_name.sql format, log a clear warning
                if [[ ! "$FILENAME" =~ ^[0-9]{8}_[0-9]+.*\.sql$ ]]; then
                  echo "⚠️  WARNING: File '$FILENAME' in sql/migrations does NOT match the expected naming format (*.sql) and will be SKIPPED by this deployment!"
                fi
              done
            fi

            # Dynamically stitch migrations into a single master transaction block.
            {
              echo "BEGIN;"
              echo "SET search_path = public_shadow, public;"
              
              # Load base initial schema configurations if applicable
              if [ -f sql/init_schema.sql ]; then
                cat sql/init_schema.sql
              fi
              
              # Evaluate and append pending delta migrations sequentially
              FILES=$($FIND_BIN sql/migrations -regextype posix-extended -regex ".*/[0-9]{8}_[0-9]+.*\.sql" | sort)
              for FILE in $FILES; do
                FILENAME=$(basename "$FILE")
                ALREADY_RUN=$(psql $PSQL_ARGS -A -c "SELECT 1 FROM public_shadow.schema_migrations WHERE filename='$FILENAME' AND status='completed';")
                
                if [ "$ALREADY_RUN" != "1" ]; then
                  echo "INSERT INTO public_shadow.schema_migrations (filename, status, started_at) VALUES ('$FILENAME', 'pending', NOW()) ON CONFLICT (filename) DO UPDATE SET status='pending';"
                  cat "$FILE"
                  echo "UPDATE public_shadow.schema_migrations SET ended_at=NOW(), status='completed' WHERE filename='$FILENAME';"
                fi
              done
              echo "COMMIT;"
            } > /tmp/compiled_migration.sql

            # Fire off the completed migration chain to PostgreSQL
            psql $PSQL_ARGS -f /tmp/compiled_migration.sql
            rm -f /tmp/compiled_migration.sql

            echo "Reinforcing application schema access privileges and running atomic schema swap..."
            psql $PSQL_ARGS -c "
              GRANT USAGE ON SCHEMA public_shadow TO recipe_app_user;
              GRANT SELECT, INSERT, UPDATE, DELETE, TRUNCATE ON ALL TABLES IN SCHEMA public_shadow TO recipe_app_user;
              GRANT SELECT, USAGE ON ALL SEQUENCES IN SCHEMA public_shadow TO recipe_app_user;
              
              BEGIN;
                ALTER SCHEMA public RENAME TO public_old;
                ALTER SCHEMA public_shadow RENAME TO public;
              COMMIT;
            "

            CURRENT_STEP="BUILD"
            echo "[Step 5/7] Building WAR file"
            $MVN_BIN clean package -DskipTests

            CURRENT_STEP="DEPLOYMENT"
            echo "[Step 6/7] Deploying versioned WAR..."
            VERSION_NAME="${{ vars.PROD_DEPLOY_NAME }}##${TAG_NAME}.war"
            BUILD_WAR="${{ vars.PROD_APP_PATH }}/target/${{ vars.PROD_APP_NAME }}.war"
            cp "$BUILD_WAR" "${{ vars.PROD_DEPLOY_PATH }}/$VERSION_NAME"

            CURRENT_STEP="FINAL_CLEANUP"
            echo "[Step 7/7] Cleaning up environment..."
            $GIT_BIN checkout .
            $MVN_BIN clean
            
            echo "--- Deployment of $TAG_NAME completed successfully! ---"
