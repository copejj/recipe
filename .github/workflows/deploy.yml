name: Production Deployment

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_tag:
        description: 'Tag to use for testing (e.g. v1.0.0-test)'
        required: false
        default: 'testing'

jobs:
  deploy-to-production:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deployment
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_HOST: ${{ secrets.DB_HOST }}
          TAG_NAME: ${{ github.event.inputs.test_tag || github.event.release.tag_name }}
        with:
          host: ${{ vars.PROD_HOST }}
          port: ${{ secrets.SSH_PRIVATE_PORT }}
          username: ${{ secrets.SSH_PRIVATE_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_NAME,DB_USER,DB_PASS,DB_HOST,TAG_NAME
          script: |
            CURRENT_STEP="INITIALIZATION"
            echo "[Step 1/7] --- Starting Deployment for $TAG_NAME ---"
            
            GIT_BIN="/usr/bin/git"
            MVN_BIN="/usr/bin/mvn"
            FIND_BIN="/usr/bin/find"
            
            cd ${{ vars.PROD_APP_PATH }}
            export PGPASSWORD="$DB_PASS"
            
            PSQL_ARGS="-h $DB_HOST -U $DB_USER -d $DB_NAME -t --set ON_ERROR_STOP=1"
            DUMP_ARGS="-h $DB_HOST -U $DB_USER -d $DB_NAME --no-subscriptions --no-publications -x -O"
            
            cleanup_on_failure() {
              EXIT_CODE=$?
              if [ $EXIT_CODE -ne 0 ]; then
                echo "!!! ERROR DETECTED in Step: $CURRENT_STEP (Exit Code: $EXIT_CODE) !!!"
                
                if [ "$CURRENT_STEP" == "DATABASE_MIGRATION" ] || [ "$CURRENT_STEP" == "DATABASE_BACKUP" ]; then
                  echo "Cleaning up staging shadow schema due to failure..."
                  psql $PSQL_ARGS -c "DROP SCHEMA IF EXISTS public_shadow CASCADE;"
                fi
                
                $GIT_BIN checkout .
                exit $EXIT_CODE
              fi
            }
            trap cleanup_on_failure ERR

            CURRENT_STEP="DATABASE_BACKUP"
            echo "[Step 2/7] Cleaning up older historical backups & preparing isolated shadow schema..."
            
            # Clean up old sandboxes natively using your migration user credentials ($PSQL_ARGS)
            psql $PSQL_ARGS -c "DROP SCHEMA IF EXISTS public_old CASCADE; DROP SCHEMA IF EXISTS public_shadow CASCADE;"
            
            # 1. Dump raw production layout (contains explicit 'public.' prefix references)
            pg_dump $DUMP_ARGS -n public -f /tmp/live_full_snapshot.sql
            
            # 2. FIXED STRIP: Map 'public.' prefix references to 'public_shadow.', but completely
            # delete the 'CREATE SCHEMA public;' line out of the file text.
            sed -E "/^CREATE SCHEMA/d; s/\bpublic\.([a-zA-Z0-9_]+)/public_shadow.\1/g" /tmp/live_full_snapshot.sql > /tmp/shadow_full_snapshot.sql
            
            # 3. Natively create the shadow schema container using your migration user credentials (unblocked by your GRANT CREATE rule)
            psql $PSQL_ARGS -c "CREATE SCHEMA public_shadow;"
            
            # 4. Populate the shadow schema sandbox safely using your migration user credentials
            psql $PSQL_ARGS -f /tmp/shadow_full_snapshot.sql
            
            psql $PSQL_ARGS -c "ALTER SCHEMA public_shadow OWNER TO $DB_USER;"
            
            echo "Standardizing cloned table ownership rules..."
            psql $PSQL_ARGS -c "
              DO \$\$ DECLARE
                  r RECORD;
              BEGIN
                  FOR r IN (SELECT tablename FROM pg_tables WHERE schemaname = 'public_shadow') LOOP
                      EXECUTE 'ALTER TABLE public_shadow.' || quote_ident(r.tablename) || ' OWNER TO $DB_USER;';
                  END LOOP;
                  FOR r IN (SELECT sequencename FROM pg_sequences WHERE schemaname = 'public_shadow') LOOP
                      EXECUTE 'ALTER SEQUENCE public_shadow.' || quote_ident(r.sequencename) || ' OWNER TO $DB_USER;';
                  END LOOP;
              END \$\$;
            "
            rm -f /tmp/live_full_snapshot.sql /tmp/shadow_full_snapshot.sql

            CURRENT_STEP="SOURCE_CHECKOUT"
            echo "[Step 3/7] Fetching code for tag: $TAG_NAME"
            $GIT_BIN fetch --tags --all
            $GIT_BIN checkout -B "release-$TAG_NAME" "$TAG_NAME"

            CURRENT_STEP="DATABASE_MIGRATION"
            echo "[Step 4/7] Running database migrations against shadow schema natively..."
            
            SEARCH_PATH_ARG="--set search_path=public_shadow"

            # Execute your base initialization schema cleanly inside public_shadow via structured string configuration
            (echo "SET search_path TO public_shadow;"; cat sql/init_schema.sql) | psql $PSQL_ARGS

            # Iterate through your versioned migration files in chronological order
            FILES=$($FIND_BIN sql/migrations -regextype posix-extended -regex ".*/[0-9]{8}_[0-9]+.*\.sql" | sort)
            for FILE in $FILES; do
              FILENAME=$(basename "$FILE")
              
              # Check migration history metrics natively within our public_shadow schema
              ALREADY_RUN=$(psql $PSQL_ARGS $SEARCH_PATH_ARG -A -c "SELECT 1 FROM schema_migrations WHERE filename='$FILENAME' AND status='completed';")
              if [ "$ALREADY_RUN" == "1" ]; then continue; fi
              
              echo "Executing migration on shadow data natively: $FILENAME"
              psql $PSQL_ARGS $SEARCH_PATH_ARG -c "INSERT INTO schema_migrations (filename, status) VALUES ('$FILENAME', 'pending') ON CONFLICT (filename) DO UPDATE SET status='pending', started_at=NOW(), ended_at=NULL;"
              
              # --- FIXED LINE LAYER: Forcibly prepend the search_path declaration to the file stream input ---
              (echo "SET search_path TO public_shadow;"; cat "$FILE") | psql $PSQL_ARGS
              
              psql $PSQL_ARGS $SEARCH_PATH_ARG -c "UPDATE schema_migrations SET ended_at=NOW(), status='completed' WHERE filename='$FILENAME';"
            done

            CURRENT_STEP="BUILD"
            echo "[Step 5/7] Building WAR file"
            $MVN_BIN clean package -DskipTests

            CURRENT_STEP="DEPLOYMENT"
            echo "[Step 6/7] Deploying versioned WAR and triggering isolated context reload..."
            VERSION_NAME="${{ vars.PROD_DEPLOY_NAME }}##${TAG_NAME}.war"
            BUILD_WAR="${{ vars.PROD_APP_PATH }}/target/${{ vars.PROD_APP_NAME }}.war"
            cp "$BUILD_WAR" "${{ vars.PROD_DEPLOY_PATH }}/$VERSION_NAME"
            
            touch "${{ vars.PROD_DEPLOY_PATH }}/$VERSION_NAME"

            CURRENT_STEP="FINAL_CLEANUP"
            echo "[Step 7/7] Cleaning up environment..."
            $GIT_BIN checkout .
            $MVN_BIN clean
            echo "--- Deployment of $TAG_NAME completed successfully! ---"
